# RedAmon Agent Docker Compose (standalone)
# For full stack, use the root docker-compose.yml instead.
# API keys and LLM providers are configured in Global Settings (UI).

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redamon-agent
    ports:
      - "8090:8080"
    environment:
      # Neo4j (via host network)
      NEO4J_URI: bolt://host.docker.internal:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set - run redamon.sh (STRIDE S13)}
      # WebSocket config
      WS_HEARTBEAT_INTERVAL: "30"
      WS_TIMEOUT: "300"
      WS_MAX_MESSAGE_SIZE: "10485760"
      # No Kali tool addresses: the recon orchestrator starts each person's Kali
      # sandbox and the agent reaches it through the webapp's sandbox gateway, so a
      # standalone agent has no Kali tools.
      # Webapp API (via host network)
      WEBAPP_API_URL: http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 30s
