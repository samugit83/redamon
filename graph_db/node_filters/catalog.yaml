# THE declaration of what node filters can match on.
#
# One entry per node KIND: a graph label narrowed by a structured selector
# (never Cypher text), the fields a rule can test, and the scan-time settings
# that already skip the same noise more cheaply. Every property named here is
# checked against graph_db/schema_sections.md by build.py, and every selector
# against the other selectors on its label, so a renamed writer property or two
# kinds claiming the same node fail the gate instead of silently matching
# nothing, or matching twice.
#
# Build: python3 graph_db/node_filters/build.py        (writes both catalog.json)
#        python3 graph_db/node_filters/build.py --check (CI: fails on drift)
#
# Field types and their operators are fixed in model.py. `prop` reads one node
# property; `normalizer` derives a value from several (normalize.py), reading
# `from` when it takes a single named input.

version: 1

ordinals:
  severity: [info, low, medium, high, critical]
  confidence: [low, medium, high]
  cache_tier: [Tentative, Strong, Confirmed]

groups:
  - { id: vulnerability, label: Vulnerability }
  - { id: other_findings, label: Other findings }

# Fields every Vulnerability kind shares. A kind lists `common: vulnerability`
# and may override any of these with its own definition.
common:
  vulnerability:
    severity:   { type: ordinal, scale: severity, normalizer: severity, label: Severity }
    cvss:       { type: number, normalizer: cvss, label: CVSS score }
    cve_ids:    { type: list, normalizer: cve_ids, label: CVE ids }
    has_cve:    { type: bool, normalizer: has_cve, label: Has a CVE }
    cve_year:   { type: number, normalizer: cve_year, label: Newest CVE year }
    name:       { type: text, normalizer: name, label: Name }
    updated_at: { type: date, prop: updated_at, label: Last reported }

kinds:
  vuln.nuclei:
    group: vulnerability
    label: Nuclei
    graph_label: Vulnerability
    select: [{ prop: source, in: [nuclei] }]
    sources: [nuclei]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      template_id:       { type: text, prop: template_id, label: Template id }
      tags:              { type: list, prop: tags, label: Tags }
      category:
        type: enum
        prop: category
        label: Category
        values: [xss, sqli, rce, lfi, rfi, ssrf, xxe, ssti, cve, exposure, misconfiguration,
                 authentication, exposed_panel, technology, takeover, dos, idor, csrf,
                 open_redirect, crlf, injection, file_upload, path_traversal,
                 information_disclosure, ssl_tls, cloud, general]
      cwe_ids:           { type: list, prop: cwe_ids, label: CWE ids }
      is_dast_finding:   { type: bool, prop: is_dast_finding, label: DAST finding }
      matcher_name:      { type: text, prop: matcher_name, label: Matcher }
      matched_at:        { type: url, prop: matched_at, label: Matched at }
      host:              { type: host, prop: host, label: Host }
      matched_ip:        { type: ip, prop: matched_ip, label: Matched IP }
      port:              { type: number, normalizer: port_from_url, from: matched_at, label: Port }
      extracted_results: { type: list, prop: extracted_results, label: Extracted results }
    overlaps:
      - { setting: nucleiSeverity, tab: vuln }
      - { setting: nucleiExcludeTags, tab: vuln }
      - { setting: nucleiExcludeTemplates, tab: vuln }
    examples:
      - { name: Informational templates, all: [{ field: severity, op: in, value: [info] }] }
      - name: Tech and SSL tags at low or below
        all:
          - { field: tags, op: contains_any, value: [tech, ssl] }
          - { field: severity, op: lte, value: low }

  vuln.security_check:
    group: vulnerability
    label: Security checks
    graph_label: Vulnerability
    select: [{ prop: source, in: [security_check] }, { prop: type, not_eq: waf_bypass }]
    sources: [security_check]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      type:
        type: enum
        prop: type
        label: Check
        values: [direct_ip_http, direct_ip_https, ip_api_exposed,
                 tls_expired, tls_expiring_soon, tls_self_signed, tls_hostname_mismatch,
                 tls_weak_version, tls_weak_cipher, tls_wildcard_overbroad,
                 tls_weak_version_supported, tls_weak_cipher_supported,
                 missing_referrer_policy, missing_permissions_policy, missing_coop,
                 missing_corp, missing_coep, cache_control_missing, csp_unsafe_inline,
                 login_no_https, session_no_secure, session_no_httponly, basic_auth_no_tls,
                 insecure_form_action, no_rate_limiting,
                 spf_missing, dmarc_missing, dnssec_missing, zone_transfer,
                 admin_port_exposed, database_exposed, redis_no_auth,
                 kubernetes_api_exposed, smtp_open_relay,
                 open_console, debug_page, unfinished_installer, dev_server,
                 directory_listing, defaced_page, takeover_error_page, test_certificate]
        value_groups:
          Direct IP access: [direct_ip_http, direct_ip_https, ip_api_exposed]
          TLS: [tls_expired, tls_expiring_soon, tls_self_signed, tls_hostname_mismatch,
                tls_weak_version, tls_weak_cipher, tls_wildcard_overbroad,
                tls_weak_version_supported, tls_weak_cipher_supported]
          Headers: [missing_referrer_policy, missing_permissions_policy, missing_coop,
                    missing_corp, missing_coep, cache_control_missing, csp_unsafe_inline]
          Auth and session: [login_no_https, session_no_secure, session_no_httponly,
                             basic_auth_no_tls, insecure_form_action, no_rate_limiting]
          DNS and mail: [spf_missing, dmarc_missing, dnssec_missing, zone_transfer]
          Exposed services: [admin_port_exposed, database_exposed, redis_no_auth,
                             kubernetes_api_exposed, smtp_open_relay]
          Page content: [open_console, debug_page, unfinished_installer, dev_server,
                         directory_listing, defaced_page, takeover_error_page, test_certificate]
      problem:        { type: text, prop: problem, label: Problem page (catalog row) }
      missing_header: { type: text, prop: missing_header, label: Missing header }
      url:            { type: url, prop: url, label: URL }
      hostname:       { type: host, prop: hostname, label: Hostname }
      matched_ip:     { type: ip, prop: matched_ip, label: IP }
      port:           { type: number, prop: port, label: Port }
      status_code:    { type: number, prop: status_code, label: HTTP status }
    overlaps:
      - { setting: securityCheckEnabled, tab: security }
      - { setting: securityCheckCacheControlMissing, tab: security }
      - { setting: securityCheckDirectIpHttp, tab: security }
    examples:
      - name: Informational header checks
        all:
          - { field: type, op: in, value: [missing_coop, missing_corp, missing_coep, cache_control_missing] }
      - name: DNS and mail posture
        all:
          - { field: type, op: in, value: [spf_missing, dmarc_missing, dnssec_missing] }
    notes:
      - >-
        The DNS checks and the port-exposure checks carry no URL or host, so each
        of those check types is ONE node per project, and a rule on its host or
        URL never matches it.

  vuln.waf_bypass:
    group: vulnerability
    label: WAF bypass (origin exposed)
    graph_label: Vulnerability
    select: [{ prop: type, eq: waf_bypass }, { prop: source, in: [security_check, origin_discovery] }]
    sources: [security_check, origin_discovery]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      source:
        type: enum
        prop: source
        label: Found by
        values: [security_check, origin_discovery]
      confidence_score: { type: number, prop: confidence_score, label: Origin confidence (0-100) }
      origin_discovery_method:
        type: enum
        prop: origin_discovery_method
        label: Discovery method
        values: [subdomain, cert_san, favicon_hash, passive_dns, ip_history, file_hash, file_name, unknown]
      match_method:  { type: enum, prop: match_method, label: Match method, values: [direct, host-header] }
      origin_source:
        type: enum
        prop: origin_source
        label: Origin source
        values: [dns, crtsh, shodan, censys, fofa, zoomeye, otx, virustotal, securitytrails, viewdns,
                 urlscan_history, urlscan_hash, urlscan_filename, unknown]
      file_match:      { type: bool, prop: file_match, label: Served the site's own file }
      cdn_fronting:    { type: text, prop: cdn_fronting, label: CDN }
      html_similarity: { type: number, prop: html_similarity, label: HTML similarity (0-100) }
      cert_match:      { type: number, prop: cert_match, label: Certificate match (0-100) }
      header_match:    { type: number, prop: header_match, label: Header match (0-100) }
      matched_ip:      { type: ip, prop: matched_ip, label: Origin IP }
      hostname:        { type: host, prop: hostname, label: Hostname }
      port:            { type: number, prop: port, label: Port }
    examples:
      - name: Low-confidence origins
        all: [{ field: confidence_score, op: lt, value: 60 }]
    notes:
      - >-
        The security check and origin discovery write the same node. Its `source`
        is `security_check` whenever the security check found it, whichever ran
        first, so `origin_discovery` means origin discovery alone found it. Only
        origin discovery sets the match scores, so a rule on them never matches a
        bypass the security check alone found.

  vuln.nmap_nse:
    group: vulnerability
    label: Nmap NSE
    graph_label: Vulnerability
    select: [{ prop: source, in: [nmap_nse] }]
    sources: [nmap_nse]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      name:   { type: text, prop: name, label: Script }
      state:  { type: enum, prop: state, label: State, values: [VULNERABLE, LIKELY VULNERABLE] }
      port:   { type: number, prop: port_number, label: Port }
      output: { type: text, prop: output, label: Script output }
    overlaps:
      - { setting: nmapScriptScan, tab: port }
    examples:
      - name: Only likely, not confirmed
        all: [{ field: state, op: in, value: [LIKELY VULNERABLE] }]
    notes:
      - NSE findings are always written as high severity, whatever the script reported.

  vuln.takeover:
    group: vulnerability
    label: Subdomain takeover
    graph_label: Vulnerability
    select: [{ prop: source, in: [takeover_scan] }]
    sources: [takeover_scan]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      verdict:            { type: enum, prop: verdict, label: Verdict, values: [confirmed, likely, manual_review] }
      confidence:         { type: number, prop: confidence, label: Confidence (0-100) }
      takeover_provider:  { type: text, prop: takeover_provider, label: Provider }
      takeover_method:
        type: enum
        prop: takeover_method
        label: Method
        values: [cname, ns, dns, mx, spf, txt, stale_a]
      confirmation_count: { type: number, prop: confirmation_count, label: Confirmations }
      hostname:           { type: host, prop: hostname, label: Hostname }
      cname_target:       { type: host, prop: cname_target, label: CNAME target }
    overlaps:
      - { setting: takeoverConfidenceThreshold, tab: vuln }
    examples:
      - name: Manual review only
        all: [{ field: verdict, op: in, value: [manual_review] }]

  vuln.urlscan:
    group: vulnerability
    label: urlscan history
    graph_label: Vulnerability
    select: [{ prop: source, in: [urlscan_leak, url_archive] }]
    sources: [urlscan_leak, url_archive]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      type:
        type: enum
        prop: type
        label: Kind
        values: [leaked_one_time_link, sensitive_file_seen, open_redirect_seen, takeover_page_seen,
                 open_console_seen, debug_page_seen, installer_seen, dev_server_seen,
                 directory_listing_seen, defaced_page_seen, test_certificate_seen]
      link_kind:
        type: enum
        prop: link_kind
        label: One-time link
        values: [password_reset, account_setup, invite, payment, login_link]
      file_kind:
        type: enum
        prop: file_kind
        label: File kind
        values: [env, vcs, private_key, db_dump, backup, log, config, debug_page, installer,
                 web_shell_trace, file_manager, debug_console, memory_dump, salesforce_aura]
      problem:
        type: text
        prop: problem
        label: Problem page (catalog row)
      outcome:
        type: enum
        prop: outcome
        label: Takeover outcome
        values: [likely_takeover, possible_takeover, dangling_dns]
      provider:   { type: text, prop: provider, label: Takeover provider }
      hostname:   { type: host, prop: hostname, label: Hostname }
      url:        { type: url, prop: url, label: URL (masked) }
      last_seen:  { type: text, prop: last_seen, label: Last seen on urlscan }
    examples:
      - name: Old directory listings
        all: [{ field: type, op: in, value: [directory_listing_seen] }]
    notes:
      - >-
        Seen in a public urlscan scan (`urlscan_leak`) or in a web archive's URL
        list (`url_archive`: GAU, ParamSpider), never requested by RedAmon: a
        leaked link or file is the public record itself. Whether a file is still
        online is Route Exposure's job.

  vuln.vhost_sni:
    group: vulnerability
    label: VHost and SNI
    graph_label: Vulnerability
    select: [{ prop: source, in: [vhost_sni_enum] }]
    sources: [vhost_sni_enum]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      type:
        type: enum
        prop: type
        label: Anomaly
        values: [hidden_vhost, hidden_sni_route, host_header_bypass]
      layer:                  { type: enum, prop: layer, label: Layer, values: [L7, L4, both] }
      internal_pattern_match: { type: text, prop: internal_pattern_match, label: Internal keyword }
      size_delta:             { type: number, prop: size_delta, label: Size delta (bytes) }
      observed_status:        { type: number, prop: observed_status, label: Observed status }
      port:                   { type: number, prop: port, label: Port }
      hostname:               { type: host, prop: hostname, label: Hostname }
      ip:                     { type: ip, prop: ip, label: IP }
    overlaps:
      - { setting: vhostSniBaselineSizeTolerance, tab: vuln }
    examples:
      - name: Size-only anomalies
        all:
          - { field: severity, op: in, value: [info] }
          - { field: internal_pattern_match, op: missing }

  vuln.cache_poisoning:
    group: vulnerability
    label: Web cache poisoning
    graph_label: Vulnerability
    select: [{ prop: source, in: [cache_poisoning] }]
    sources: [cache_poisoning]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      confidence_tier: { type: ordinal, scale: cache_tier, prop: confidence_tier, label: Confidence tier }
      confidence:      { type: number, prop: confidence, label: Confidence (0-1) }
      cache_impact:
        type: enum
        prop: cache_impact
        label: Impact
        values: [stored_xss, reflected_script, open_redirect, deception, dos, reflected, response_change]
      cache_technique:
        type: enum
        prop: cache_technique
        label: Technique
        values: [unkeyed_header, unkeyed_param, cache_deception, fat_get, normalization, request_smuggling,
                 framework_next, framework_nuxt, framework_remix, framework_react_router]
      cache_vector_type: { type: enum, prop: cache_vector_type, label: Vector, values: [header, param, fat_get, path_param, path] }
      source_engine:     { type: enum, prop: source_engine, label: Engine, values: [wcvs, hypothesis] }
      cache_header:      { type: text, prop: cache_header, label: Unkeyed header }
      cache_param:       { type: text, prop: cache_param, label: Unkeyed parameter }
      endpoint:          { type: url, prop: endpoint, label: Endpoint }
    overlaps:
      - { setting: webCachePoisonMinConfidence, tab: vuln }
    examples:
      - name: Reflected only, below Confirmed
        all:
          - { field: cache_impact, op: in, value: [reflected] }
          - { field: confidence_tier, op: lt, value: Confirmed }
    notes:
      - >-
        A finding with no scored impact keeps the writer's placeholder of medium
        severity and CVSS 5.0, so a severity or CVSS rule reads the placeholder.

  vuln.serialized_scan:
    group: vulnerability
    label: Insecure deserialization
    graph_label: Vulnerability
    select: [{ prop: source, in: [serialized_scan] }]
    sources: [serialized_scan]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      deser_language:
        type: enum
        prop: deser_language
        label: Language
        values: [java, php, python, dotnet, ruby]
      deser_format:
        type: enum
        prop: deser_format
        label: Format
        values: [native_java, jackson_json, fastjson, xmldecoder, xstream, snakeyaml,
                 php_serialize, phar, python_pickle, dotnet_binaryformatter, viewstate,
                 ruby_marshal, hessian]
      deser_transport: { type: enum, prop: deser_transport, label: Transport, values: [cookie, param, header] }
      deser_location:  { type: text, prop: deser_location, label: Location }
      deser_magic:     { type: text, prop: deser_magic, label: Marker }
      needs_agent_confirmation: { type: bool, prop: needs_agent_confirmation, label: Awaiting agent confirmation }
      confidence:      { type: number, prop: confidence, label: Confidence (0-1) }
      deser_jev_format:
        type: enum
        prop: deser_jev_format
        label: Jev format
        values: [native_java, jackson_json, fastjson, xmldecoder, xstream, snakeyaml,
                 php_serialize, phar, python_pickle, dotnet_binaryformatter, viewstate,
                 ruby_marshal, hessian, none]
      deser_jev_exploitability: { type: number, prop: deser_jev_exploitability, label: Jev reachability (0-100) }
    examples:
      - name: Candidates awaiting confirmation
        all:
          - { field: needs_agent_confirmation, op: is_true }
      - name: Jev reads as not a serialized object
        all:
          - { field: deser_jev_format, op: in, value: [none] }
    notes:
      - >-
        Select on source alone, never needs_agent_confirmation: a pending
        candidate must stay unmuted so the agent's query_graph (which inherits the
        mute exclusion) can read it. Report/Insights noise is handled by exclusion
        predicates, not muting.

  vuln.route_exposure:
    group: vulnerability
    label: Route exposure
    graph_label: Vulnerability
    select: [{ prop: source, in: [route_exposure] }]
    sources: [route_exposure]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      exposure_kind:
        type: enum
        prop: exposure_kind
        label: Exposure kind
        values: [anonymous_access, sensitive_data, cors_misconfig, auth_cacheable, vcs_exposure,
                 env_file, config_file, backup_file, debug_console, debug_endpoint, debug_page,
                 route_catalog, secret_in_response]
      route_class:
        type: enum
        prop: route_class
        label: Route class
        values: [internal_api, debug_management, admin_function, data_export, old_version,
                 uploaded_content, client_gated, unknown]
      needs_agent_confirmation: { type: bool, prop: needs_agent_confirmation, label: Awaiting agent confirmation }
      anon_status:    { type: number, prop: anon_status, label: Anonymous status }
      generated_by:
        type: enum
        prop: generated_by
        label: Generated by
        values: [found, seed, vcs, backup, version, sibling, framework, catalog, cross_host]
      confidence:     { type: number, prop: confidence, label: Confidence (0-1) }
      host:           { type: host, prop: host, label: Host }
      matched_at:     { type: url, prop: matched_at, label: URL }
      path:           { type: text, prop: path, label: Path }
      http_method:    { type: text, prop: http_method, label: Method }
      authed_status:  { type: number, prop: authed_status, label: Logged-in status }
      bodies_match:   { type: bool, prop: bodies_match, label: Same page logged in }
      anon_content_class:
        type: enum
        prop: anon_content_class
        label: Anonymous body type
        values: [json, html, text, xml, binary, other]
      auth_expected_by: { type: list, prop: auth_expected_by, label: Login expected because }
      leak_signals:   { type: list, prop: leak_signals, label: Leak signals }
      pii_types:      { type: list, prop: pii_types, label: Personal data types }
      sensitive_fields: { type: list, prop: sensitive_fields, label: Sensitive fields }
      signature:      { type: text, prop: signature, label: Signature }
      catch_all_check:
        type: enum
        prop: catch_all_check
        label: Catch-all check
        values: [passed, failed, n/a]
    examples:
      - name: Leads awaiting confirmation
        all:
          - { field: needs_agent_confirmation, op: is_true }
      - name: Debug pages on old versions
        all:
          - { field: exposure_kind, op: in, value: [debug_page] }
          - { field: route_class, op: in, value: [old_version] }
    notes:
      - >-
        Select on source alone, never needs_agent_confirmation: a pending
        candidate must stay unmuted so the agent's query_graph (which inherits the
        mute exclusion) can read it. Report/Insights noise is handled by exclusion
        predicates, not muting.

  vuln.graphql:
    group: vulnerability
    label: GraphQL
    graph_label: Vulnerability
    select: [{ prop: source, in: [graphql_scan, graphql_cop] }]
    sources: [graphql_scan, graphql_cop]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      source: { type: enum, prop: source, label: Scanner, values: [graphql_scan, graphql_cop] }
      vulnerability_type:
        type: enum
        prop: vulnerability_type
        label: Issue
        values: [graphql_introspection_enabled, graphql_sensitive_data_exposure,
                 graphql_field_suggestions_enabled, graphql_ide_exposed,
                 graphql_get_method_allowed, graphql_alias_overloading,
                 graphql_batch_query_allowed, graphql_tracing_enabled,
                 graphql_directive_overloading, graphql_circular_introspection,
                 graphql_get_based_mutation, graphql_post_csrf, graphql_unhandled_error,
                 graphql_field_duplication_allowed]
      endpoint: { type: url, prop: endpoint, label: Endpoint }
    overlaps:
      - { setting: graphqlCopEnabled, tab: vuln }
    examples:
      - name: Informational GraphQL behaviour
        all:
          - { field: vulnerability_type, op: in, value: [graphql_tracing_enabled, graphql_unhandled_error] }

  vuln.ai_surface:
    group: vulnerability
    label: AI surface (MCP)
    graph_label: Vulnerability
    select: [{ prop: source, in: [ai_surface_recon] }]
    sources: [ai_surface_recon]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      type:
        type: enum
        prop: type
        label: Issue
        values: [mcp_annotation_mismatch, mcp_tool_poisoning, mcp_prompt_injection,
                 mcp_data_exfiltration, mcp_command_injection, mcp_code_execution,
                 mcp_credential_harvesting]
      ai_owasp_llm_id:    { type: enum, prop: ai_owasp_llm_id, label: OWASP LLM id, values: [LLM01, LLM05, LLM06] }
      ai_atlas_technique: { type: text, prop: ai_atlas_technique, label: ATLAS technique }
    examples:
      - name: Annotation mismatches
        all: [{ field: type, op: in, value: [mcp_annotation_mismatch] }]

  vuln.passive_cve:
    group: vulnerability
    label: Passive CVEs (Shodan, Netlas, CriminalIP)
    graph_label: Vulnerability
    select:
      - { prop: source, in: [shodan_api, internetdb, shodan_host_lookup, shodan, netlas, criminalip] }
    sources: [shodan_api, internetdb, shodan_host_lookup, shodan, netlas, criminalip]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      source:
        type: enum
        prop: source
        label: Provider
        values: [shodan_api, internetdb, shodan_host_lookup, shodan, netlas, criminalip]
      has_exploit: { type: bool, prop: has_exploit, label: Public exploit (Netlas) }
      detection_method:
        type: enum
        prop: detection_method
        label: Evidence (Shodan)
        values: [passive_verified, passive_version_match, passive_catalog]
      port_confirmed:
        type: bool
        prop: port_confirmed
        label: Port open on this scan (Shodan)
    overlaps:
      - { setting: cveLookupMinCvss, tab: cve }
    examples:
      - name: Old CVEs with no public exploit
        all:
          - { field: cve_year, op: lt, value: 2015 }
          - { field: has_exploit, op: is_false }
      - name: Shodan CVEs on a port the scan found closed
        all: [{ field: port_confirmed, op: is_false }]
      - name: Shodan CVEs with no service version seen
        all: [{ field: detection_method, op: in, value: [passive_catalog] }]
      - name: Shodan CVEs recorded before evidence grading
        all:
          - { field: source, op: in, value: [shodan_api, internetdb, shodan_host_lookup, shodan] }
          - { field: detection_method, op: missing }
    notes:
      - >-
        These providers are recon finding sources: the sweep after a scan
        applies the rules to their CVEs, and a full scan prunes the ones it no
        longer reports, except on an IP the provider could not be asked about.
      - >-
        Netlas records a severity and a public exploit; Shodan records a severity
        only when its banner gave a CVSS score, plus the evidence grade
        (detection_method): a Shodan-verified banner, a banner's product and
        version, or the IP's catalog alone. CriminalIP carries the CVE and its
        CVSS score.
      - >-
        port_confirmed says what this scan's port scan found on a Shodan CVE's
        port: true open, false looked at and not open. It is missing when the
        scan did not look at that port (a top-N port list, no port scan), so
        "is false" never mutes a CVE nobody re-checked.

  vuln.osv:
    group: vulnerability
    label: Vulnerable packages (OSV)
    graph_label: Vulnerability
    select: [{ prop: source, in: [osv] }]
    sources: [osv]
    behaviour: finding
    phase: 1
    common: vulnerability
    fields:
      advisory_id:     { type: text, prop: advisory_id, label: Advisory }
      advisory_prefix:
        type: enum
        normalizer: advisory_prefix
        from: advisory_id
        label: Advisory database
        values: [GHSA, PYSEC, CVE, GO, RUSTSEC, OSV, RSEC, DSA, USN]
      purl:            { type: text, prop: purl, label: Package URL }
      package_version: { type: text, prop: package_version, label: Package version }
    examples:
      - name: Ungraded advisories
        all: [{ field: severity, op: in, value: [info] }]
    notes:
      - >-
        Written by the supply-chain scanner, so in this phase only applying to the
        current graph reaches these. OSV `info` means the advisory was not graded,
        and there is no CVSS score (only a vector) yet.

  js.finding:
    group: other_findings
    label: JS Recon findings
    graph_label: JsReconFinding
    select: [{ prop: finding_type, not_eq: js_file }]
    sources: [js_recon]
    behaviour: finding
    phase: 1
    fields:
      finding_type:
        type: enum
        prop: finding_type
        label: Finding type
        values: [dependency_confusion, source_map_exposure, source_map_reference, dom_sink,
                 dev_comment, framework, email, internal_ip, object_reference, cloud_asset,
                 external_domain, ai-sdk-client, ai-sdk-key-literal, ai-sdk-browser-allowed,
                 ai-frontend-detected, ai-provider-url]
      severity:     { type: ordinal, scale: severity, normalizer: severity, label: Severity }
      confidence:   { type: ordinal, scale: confidence, prop: confidence, label: Confidence }
      source_url:   { type: url, prop: source_url, label: JS file URL }
      title:        { type: text, prop: title, label: Title }
      package_name: { type: text, prop: package_name, label: Package }
      sdk_name:     { type: text, prop: sdk_name, label: AI SDK }
      updated_at:   { type: date, prop: updated_at, label: Last reported }
    overlaps:
      - { setting: jsReconMinConfidence, tab: jsrecon }
      - { setting: jsReconDevComments, tab: jsrecon }
    examples:
      - name: Emails and external domains
        all: [{ field: finding_type, op: in, value: [email, external_domain] }]
      - name: Low-confidence developer comments
        all:
          - { field: finding_type, op: in, value: [dev_comment] }
          - { field: confidence, op: lte, value: low }

  secret:
    group: other_findings
    label: Secrets
    graph_label: Secret
    select: []
    sources: [js_recon, jsluice, urlscan, url_archive]
    behaviour: finding
    phase: 1
    fields:
      source:            { type: enum, prop: source, label: Found by, values: [js_recon, jsluice, urlscan, url_archive] }
      secret_type:       { type: text, prop: secret_type, label: Secret type }
      key_type:          { type: text, prop: key_type, label: Key category }
      severity:          { type: ordinal, scale: severity, normalizer: severity, label: Severity }
      confidence:        { type: ordinal, scale: confidence, prop: confidence, label: Confidence }
      validation_status:
        type: enum
        prop: validation_status
        label: Validation
        values: [validated, rejected, unknown, format_invalid, unvalidated, skipped, incomplete,
                 format_validated, invalid, error]
        # `invalid` and `error` are what nodes written before the explicit
        # states hold. A rule naming `invalid` (saved, preset, imported, MCP)
        # also matches what replaced its dead cases; never `unknown`.
        aliases: { invalid: [rejected, format_invalid] }
      detection_method: { type: enum, prop: detection_method, label: Detection, values: [regex, trufflehog] }
      public_client_key: { type: bool, normalizer: public_client_key, label: Public by design }
      source_url:       { type: url, prop: source_url, label: Found in }
      base_url:         { type: url, prop: base_url, label: Base URL }
      updated_at:       { type: date, prop: updated_at, label: Last reported }
    examples:
      - name: Keys that failed validation
        all: [{ field: validation_status, op: in, value: [invalid, rejected, format_invalid] }]
    notes:
      - >-
        `jsluice` secrets come from resource enumeration's jsluice pass; everything
        JS Recon finds is `js_recon`; `urlscan` secrets were written in a URL a
        public urlscan scan recorded, `url_archive` ones in a URL a web archive
        listed (GAU, ParamSpider). Both are matched by their HMAC and keep the
        value only for display. Only JS Recon records a key category, confidence,
        detection method and validation.

  malpackage:
    group: other_findings
    label: Malicious packages
    graph_label: MalPackageFinding
    select: []
    sources: []
    behaviour: finding
    phase: 1
    fields:
      verdict:     { type: enum, prop: verdict, label: Verdict, values: [malicious, suspicious] }
      source_tool: { type: enum, prop: source_tool, label: Found by, values: [osv, guarddog, typosquat] }
      severity:    { type: ordinal, scale: severity, normalizer: severity, label: Severity }
      advisory_id: { type: text, prop: advisory_id, label: Advisory or rule }
      in_incident_catalog:
        type: bool
        normalizer: present
        from: incident_id
        label: In the incident catalog
      soft_error:  { type: bool, prop: soft_error, label: Analysis error }
      title:       { type: text, prop: title, label: Title }
      updated_at:  { type: date, prop: updated_at, label: Last reported }
    examples:
      - name: GuardDog analysis errors
        all:
          - { field: source_tool, op: in, value: [guarddog] }
          - { field: soft_error, op: is_true }
    notes:
      - >-
        Written by the supply-chain scanner, so in this phase only applying to the
        current graph reaches these. For a suspicious package the advisory field
        holds the GuardDog rule name.

# Vulnerability sources no Phase 1 kind selects, and why. build.py fails on a
# recon or non-recon finding source that is in neither a kind nor this list.
unfiltered_sources:
  gvm: GVM findings get their own kind in Phase 4, with a sweep after the GVM scan.
  garak: AI Attack Surface findings get their own kind in Phase 4.
  pyrit: AI Attack Surface findings get their own kind in Phase 4.
  giskard: AI Attack Surface findings get their own kind in Phase 4.
  promptfoo: AI Attack Surface findings get their own kind in Phase 4.
  skeleton: The AI Attack Surface test adapter; never a real finding.
  ai_attack_target: Stamped on the synthetic target nodes AI Attack Surface findings hang off, not on a finding.

# Recon sources that are stamped on assets, never on a finding a kind could select.
asset_sources:
  resource_enum: BaseURL, Endpoint and Parameter nodes.
  http_probe: BaseURL, Endpoint and Certificate nodes.
  vuln_scan: The Endpoint and BaseURL nodes nuclei findings attach to.
  wcvs: Only ever a `source_engine` value on cache-poisoning findings.

# Shown on the page with the reason they cannot be filtered.
locked:
  - { label: Domain, reason: The organisation (registrable) domain; scan roots and hosts hang off it. }
  - { label: CVE, reason: Shared reference data for every project; filter the findings that link to it instead. }
  - { label: MitreData, reason: Shared reference data for every project. }
  - { label: Capec, reason: Shared reference data for every project. }
  - { label: UserInput, reason: "What an operator typed in; it is the input, not a result." }
  - { label: AttackChain, reason: "The agent's own history (AttackChain, ChainStep, ChainFinding, ChainDecision, ChainFailure)." }
  - { label: GithubHunt, reason: "The GitHub hunt's scan structure (GithubHunt, GithubRepository, GithubPath)." }
  - { label: MultiscannerScan, reason: The secret multiscanner's scan structure and scanned assets. }
  - { label: SbomDocument, reason: The uploaded SBOM itself. }
  - { label: ExploitGvm, reason: A confirmed exploitation; it must stay visible. }

