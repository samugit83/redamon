# RedAmon Neo4j Docker Compose (standalone)
# For full stack, use the root docker-compose.yml instead.

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: redamon-neo4j
    ports:
      - "7474:7474"  # HTTP browser interface
      - "7687:7687"  # Bolt protocol (for Python driver)
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set - run redamon.sh (STRIDE S13)}
      - NEO4J_PLUGINS=["apoc"]
      # The same APOC list as the root docker-compose.yml, which says why.
      - NEO4J_dbms_security_procedures_unrestricted=apoc.create.node,apoc.create.relationship,apoc.merge.node,apoc.meta.*,apoc.convert.toJson,apoc.text.base64Encode
      - NEO4J_dbms_security_procedures_allowlist=apoc.create.node,apoc.create.relationship,apoc.merge.node,apoc.meta.*,apoc.convert.toJson,apoc.text.base64Encode
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
