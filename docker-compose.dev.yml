# =============================================================================
# RedAmon - Development Overrides
# =============================================================================
# Usage:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# =============================================================================
# Swaps the production webapp build for a dev container with Next.js fast
# refresh. Source code is volume-mounted so every save is reflected instantly.
# =============================================================================

services:
  webapp:
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    # Dev override: `next dev --turbopack` compiles on-demand and needs FAR more
    # memory than the prod `next start`. The base service's 1g memory-governor cap
    # would starve/kill the dev compiler ("Failed to fetch" / never compiles), so
    # relax it generously here. This only affects `up dev`.
    mem_limit: ${WEBAPP_DEV_MEM:-4g}
    # The same startup scripts, in the same order and with the same fatal/non-fatal
    # split, as the production entrypoint in webapp/Dockerfile (see the comment there
    # for why each sits before or after `db push`); tests/webapp_dev_startup_parity_test.sh
    # fails when the two lists differ.
    command:
      - sh
      - -c
      - |
        npm install || exit 1
        node scripts/migrate-trufflehog-profiles.mjs || exit 1
        node scripts/add-js-recon-trufflehog-column.mjs || exit 1
        npx prisma db push --accept-data-loss || exit 1
        node scripts/apply-ingest-role.mjs
        node scripts/apply-traffic-fts.mjs
        node scripts/apply-engagement-immutability.mjs
        node scripts/apply-plugin-constraints.mjs || echo "[plugins] constraint script failed"
        node scripts/clamp-triage-review-budget.mjs
        node scripts/backfill-user-skill-toggles.mjs
        node scripts/backfill-jev-provider-selection.mjs
        node scripts/backfill-rbac-legacy-grants.mjs
        node scripts/backfill-nuclei-template-owners.mjs
        npm run dev
    volumes:
      - ./webapp:/app
      - webapp_node_modules:/app/node_modules
      - webapp_next_cache:/app/.next
      - ./recon/output:/data/recon-output:ro
      - ./recon/wordlists:/data/recon-wordlists:rw
      - ./mcp/nuclei-templates:/data/nuclei-templates:rw
      - ./scanners/gvm_scan/output:/data/gvm-output:ro
      - ./scanners/github_secret_hunt/output:/data/github-hunt-output:ro
      - ./VERSION:/app/VERSION:ro
      - js_recon_uploads:/data/js-recon-uploads
      - js_recon_custom:/data/js-recon-custom

volumes:
  webapp_node_modules:
  webapp_next_cache:
