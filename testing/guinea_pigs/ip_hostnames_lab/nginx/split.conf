# 192.88.98.13: HTTP + TLS. Its certificate names split.example-a.test, whose A
# records are this host AND the outsider (.99): a name that may be recorded but
# never scanned, because not every current address is a target.

worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    map $pid $lab_container { default "iphn-split"; }
    include /etc/nginx/lab/common.conf;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /certs/split.example-a.test.crt;
        ssl_certificate_key /certs/split.example-a.test.key;
        location / { return 200 "VHOST=_default\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name split.example-a.test;
        ssl_certificate /certs/split.example-a.test.crt;
        ssl_certificate_key /certs/split.example-a.test.key;
        location / { return 200 "VHOST=split.example-a.test\n"; }
    }
}
