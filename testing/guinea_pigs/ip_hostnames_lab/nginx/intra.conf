# iphn-intra: the private target (row E10) on redamon-network. Its address is
# whatever Docker assigns; up.sh reads it and writes intra.example-a.test into
# the lab zone, so nothing here or in the zone hard-codes it.

worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    map $pid $lab_container { default "iphn-intra"; }
    include /etc/nginx/lab/common.conf;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /certs/intra.example-a.test.crt;
        ssl_certificate_key /certs/intra.example-a.test.key;
        location / { return 200 "VHOST=_default\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name intra.example-a.test;
        ssl_certificate /certs/intra.example-a.test.crt;
        ssl_certificate_key /certs/intra.example-a.test.key;
        location / { return 200 "VHOST=intra.example-a.test\n"; }
    }
}
