# 192.88.98.11 (iphn-plain: no PTR) and 192.88.98.12 (iphn-mismatch: its PTR
# name forward-resolves to the outsider). Plain HTTP only, one site each: what
# matters about them is their DNS, not their content.

worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    map $server_addr $lab_container {
        192.88.98.11 "iphn-plain";
        192.88.98.12 "iphn-mismatch";
        default      "iphn-plain-unknown";
    }
    include /etc/nginx/lab/common.conf;

    server {
        listen 80 default_server;
        server_name _;
        location / { return 200 "VHOST=_default\n"; }
    }

    server {
        listen 80;
        server_name mismatch.example-b.test;
        location / { return 200 "VHOST=mismatch.example-b.test\n"; }
    }
}
