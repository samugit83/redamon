# 192.88.98.99: the OUTSIDER. Never a target of any lab project; outside,
# mismatch, split and gone point here. Any request in its hits.jsonl, and any
# packet in the tcpdump sidecar's capture, is traffic that left the target list.
# It answers like a real site so a leak runs to completion and leaves evidence.

worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    map $pid $lab_container { default "iphn-outsider"; }
    include /etc/nginx/lab/common.conf;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /certs/outsider.crt;
        ssl_certificate_key /certs/outsider.key;
        location / { return 200 "VHOST=_outsider\n"; }
    }
}
