# Included inside http {} by every lab nginx host. Each host defines
# $lab_container (a map) before including this file.
#
# One JSON line per request in /logs/hits.jsonl (generated/logs/<container>/ on
# the host). `ts` is epoch seconds with milliseconds: the driver slices each
# run's requests by time. `sni` is empty on plain HTTP and on a TLS handshake
# without SNI (an IP literal); `vhost` is the server block that answered ("_"
# for the default one).
log_format labjson escape=json
    '{"ts":$msec,"container":"$lab_container","client":"$remote_addr",'
    '"method":"$request_method","scheme":"$scheme","host":"$http_host",'
    '"sni":"$ssl_server_name","vhost":"$server_name","uri":"$request_uri",'
    '"status":$status,"ua":"$http_user_agent"}';
access_log /logs/hits.jsonl labjson;
error_log /dev/stderr warn;

server_tokens off;
default_type text/plain;
ssl_protocols TLSv1.2 TLSv1.3;

# The image's default temp paths sit under /var/cache/nginx, which the custom
# -c configuration does not prepare.
client_body_temp_path /tmp/nginx-client;
proxy_temp_path /tmp/nginx-proxy;
fastcgi_temp_path /tmp/nginx-fastcgi;
uwsgi_temp_path /tmp/nginx-uwsgi;
scgi_temp_path /tmp/nginx-scgi;
