# 192.88.98.10: the shared host. Seven SNI virtual hosts under four registrable
# domains, each with its own certificate and a marker body VHOST=<name>, so a
# hit line (and the body a scanner stored) proves which site a request reached.
#
# A request without SNI (https://192.88.98.10/) gets the default certificate,
# whose SANs list web, app, shop, api, moved, outside, nodns, portal and
# *.wild: what IP-mode recon learns from the certificate. hidden.example-a.test
# is deliberately absent from it; only the urlscan stub (.30) names it.

worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    map $pid $lab_container { default "iphn-web"; }
    include /etc/nginx/lab/common.conf;

    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /certs/web-default.crt;
        ssl_certificate_key /certs/web-default.key;
        location / { return 200 "VHOST=_default\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name web.example-a.test;
        ssl_certificate /certs/web.example-a.test.crt;
        ssl_certificate_key /certs/web.example-a.test.key;
        location / { return 200 "VHOST=web.example-a.test\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name app.example-a.test;
        ssl_certificate /certs/app.example-a.test.crt;
        ssl_certificate_key /certs/app.example-a.test.key;
        location / { return 200 "VHOST=app.example-a.test\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name shop.example-b.test;
        ssl_certificate /certs/shop.example-b.test.crt;
        ssl_certificate_key /certs/shop.example-b.test.key;
        location / { return 200 "VHOST=shop.example-b.test\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name api.lab-c.example;
        ssl_certificate /certs/api.lab-c.example.crt;
        ssl_certificate_key /certs/api.lab-c.example.key;
        location / { return 200 "VHOST=api.lab-c.example\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name hidden.example-a.test;
        ssl_certificate /certs/hidden.example-a.test.crt;
        ssl_certificate_key /certs/hidden.example-a.test.key;
        location / { return 200 "VHOST=hidden.example-a.test\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name portal.lab-agency.gov;
        ssl_certificate /certs/portal.lab-agency.gov.crt;
        ssl_certificate_key /certs/portal.lab-agency.gov.key;
        location / { return 200 "VHOST=portal.lab-agency.gov\n"; }
    }

    server {
        listen 80;
        listen 443 ssl;
        server_name moved.example-a.test;
        ssl_certificate /certs/moved.example-a.test.crt;
        ssl_certificate_key /certs/moved.example-a.test.key;
        location / { return 200 "VHOST=moved.example-a.test\n"; }
    }
}
