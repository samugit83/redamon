# The urlscan lab's CDN-like edge (192.88.97.40): www and shop resolve here, and
# every request is relayed to the real server behind it (uslab-origin, .41).
#
# It looks like the CDN to a scanner: the answer carries `Server: cloudflare`
# and a `cf-ray` header. Stock nginx cannot rewrite its own Server header, so the
# edge forwards the origin's (proxy_pass_header) and tells the origin it is
# relaying (X-Lab-Via-Edge); the origin then answers as `cloudflare`. A direct
# request to .41 (Origin Discovery's check) gets the origin's own Server and no
# cf-ray, as a real origin would.
#
# The full run sees .40 as a CDN edge only through REDAMON_LAB_CDN_PREFIXES
# (a lab-only hook): no real CDN publishes this prefix.

worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    log_format labjson escape=json
        '{"ts":"$time_iso8601","container":"uslab-edge","client":"$remote_addr",'
        '"method":"$request_method","scheme":"$scheme","host":"$http_host","sni":"$ssl_server_name",'
        '"uri":"$request_uri","status":$status,"ua":"$http_user_agent","range":"$http_range"}';
    access_log /logs/hits.jsonl labjson;
    error_log /dev/stderr warn;

    server_tokens off;
    proxy_pass_header Server;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Lab-Via-Edge 1;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
    proxy_ssl_server_name on;
    proxy_ssl_name $host;
    proxy_ssl_verify off;
    add_header cf-ray "${request_id}-LAB" always;
    add_header cf-cache-status DYNAMIC always;

    server {
        listen 80;
        server_name www.uslab.test shop.uslab.test;
        location / { proxy_pass http://192.88.97.41; }
    }

    # An edge answers names it does not front with an error, never the origin.
    server {
        listen 80 default_server;
        server_name _;
        location / { return 403 "error code: 1003\n"; }
    }

    server {
        listen 443 ssl;
        server_name www.uslab.test;
        ssl_certificate /certs/www.crt;
        ssl_certificate_key /certs/www.key;
        location / { proxy_pass https://192.88.97.41; }
    }

    server {
        listen 443 ssl;
        server_name shop.uslab.test;
        ssl_certificate /certs/shop.crt;
        ssl_certificate_key /certs/shop.key;
        location / { proxy_pass https://192.88.97.41; }
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_certificate /certs/edge-default.crt;
        ssl_certificate_key /certs/edge-default.key;
        location / { return 403 "error code: 1003\n"; }
    }
}
