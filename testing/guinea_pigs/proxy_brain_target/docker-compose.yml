services:
  pbtarget:
    build: .
    container_name: pbtarget
    # Join the pentest network so the capture proxy reaches it by name at
    # http://pbtarget:5000/. The agent's tools run in a person's own Kali
    # sandbox, which reaches it only once the lab is connected to that
    # sandbox's network (../README.md). Also published on host loopback for
    # manual curling.
    ports:
      - "127.0.0.1:9009:5000"
    networks:
      - pentest
    restart: unless-stopped

networks:
  pentest:
    external: true
    name: redamon_pentest-net
