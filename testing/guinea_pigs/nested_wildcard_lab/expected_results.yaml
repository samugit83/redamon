# Expected graph state after a full recon of each scenario project, once nested
# wildcards ship (scan roots below the org, one Domain per org). Asserted by
# validate_nested_wildcards.py through the inbound MCP server (query_graph).
#
# Every check is one read-only Cypher returning a column `v` (or, with
# `recon_json: <dotted.path>`, the keys or items at that path of the run's recon
# JSON), and one assertion:
#   equals    the set of v equals the list
#   superset  the set of v contains every item
#   disjoint  the set of v contains none of the items
#   true      exactly one row, v is true
#   count     the number of rows equals the integer
#
# Lab limitations (README "Lab limitations") shape these expectations: no brute
# force, so an ENUMERATE group discovers only through the certificate SANs of a
# probed host (its scan root with Root on, or a seed) and through app.js. Hence
# dev.eu.corp is never expected, and U5/U8 carry one seed host each. The host's
# systemd-resolved answers SERVFAIL to every DNSKEY query (DNSSEC off), which the
# DNSSEC check reads as "unknown", so no dnssec_missing finding is expected.

lab_settings: &lab
  masscanEnabled: false
  naabuEnabled: false
  purednsEnabled: false
  useBruteforceForSubdomains: false
  knockpyReconEnabled: false
  crtshEnabled: false
  hackerTargetEnabled: false
  subfinderEnabled: false
  shodanEnabled: false
  urlscanEnabled: false
  otxEnabled: false
  httpxProbeTlsInfo: false
  jsReconEnabled: true
  jsReconDependencyCheck: false

common_checks: &common
  - id: no_stray_domain_for_a_deeper_scan_root
    cypher: "MATCH (d:Domain) WHERE d.name IN ['api.nwlab.test','eu.corp.nwlab.test','api.nwlab-two.test','portal.nwlab-two.test'] RETURN d.name AS v"
    count: 0
  - id: every_subdomain_links_to_one_domain
    cypher: "MATCH (s:Subdomain) OPTIONAL MATCH (s)-[:BELONGS_TO]->(d:Domain) WITH s, count(d) AS n WHERE n <> 1 RETURN s.name AS v"
    count: 0

scenarios:
  U3:
    title: NW-Batch, four groups across two orgs
    create:
      domainBatchHosts:
        - "*.api.nwlab.test"
        - api.nwlab.test
        - v1.api.nwlab.test
        - www.nwlab.test
        - a.b.c.d.nwlab.test
        - "*.dev.eu.corp.nwlab.test"
        - "*.eu.corp.nwlab.test"
        - "*.nwlab-two.test"
        - nwlab-two.test
      settings: *lab
    checks:
      - id: domains_are_the_orgs
        cypher: "MATCH (d:Domain) RETURN d.name AS v"
        equals: [nwlab.test, nwlab-two.test]
      - id: api_is_a_scan_root_subdomain
        cypher: "MATCH (s:Subdomain {name:'api.nwlab.test'}) RETURN coalesce(s.is_scan_root, false) AS v"
        "true": true
      - id: api_scan_root_is_scanned_root_on
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test]
      # The lab has no brute force, and a certificate SAN name is recorded but
      # not probed (R1 scans only its root on the base code too), so a group
      # scans its root (Root on) and its seed host.
      - id: group1_root_and_seed_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test, v1.api.nwlab.test]
      - id: group2_exact_hosts_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [www.nwlab.test, a.b.c.d.nwlab.test]
      - id: group2_siblings_and_apex_not_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [nwlab.test, shop.nwlab.test, mail.nwlab.test, secret.nwlab.test, cdn.nwlab.test]
      - id: group4_root_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [nwlab-two.test]
      - id: group3_root_off_not_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [eu.corp.nwlab.test]
      - id: org_dns_findings_once_per_org
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check'}) WHERE v.type IN ['spf_missing','dmarc_missing','dnssec_missing','zone_transfer'] RETURN d.name + '|' + v.type AS v"
        equals: ["nwlab-two.test|spf_missing", "nwlab-two.test|dmarc_missing", "nwlab-two.test|zone_transfer"]
      - id: org_dns_findings_not_duplicated
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check'}) WHERE v.type IN ['spf_missing','dmarc_missing','dnssec_missing','zone_transfer'] RETURN v.id AS v"
        count: 3
      - id: coverage_stamped_on_both_orgs
        cypher: "MATCH (d:Domain) WHERE d.recon_coverage_at IS NOT NULL RETURN d.name AS v"
        equals: [nwlab.test, nwlab-two.test]
      - id: coverage_roots_merged_per_org
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) UNWIND coalesce(d.recon_coverage_roots, []) AS r RETURN r AS v"
        equals: [api.nwlab.test, nwlab.test, eu.corp.nwlab.test]
    common: true

  M6:
    title: NW-Batch created through MCP create_project; the same graph as U3
    same_as: U3

  U5:
    title: NW-Owner, ownership TXT at the org or at the scan root
    create:
      domainBatchHosts:
        - "*.api.nwlab.test"
        - v1.api.nwlab.test
        - "*.api.nwlab-two.test"
        - v1.api.nwlab-two.test
        - "*.portal.nwlab-two.test"
        - www.nwlab-two.test
      settings:
        <<: *lab
        verifyDomainOwnership: true
        ownershipToken: nwlab-token
    checks:
      - id: passing_groups_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [v1.api.nwlab.test, v2.api.nwlab.test, v1.api.nwlab-two.test, v2.api.nwlab-two.test]
      - id: refused_groups_scan_nothing
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [portal.nwlab-two.test, www.nwlab-two.test, nwlab-two.test, api.nwlab.test, api.nwlab-two.test]
    common: true

  U6:
    title: NW-Deep, single-domain target below the org
    create:
      targetDomain: api.nwlab.test
      subdomainList: ["."]
      settings: *lab
    checks:
      - id: one_domain_the_org
        cypher: "MATCH (d:Domain) RETURN d.name AS v"
        equals: [nwlab.test]
      - id: target_is_a_scan_root_subdomain
        cypher: "MATCH (s:Subdomain {name:'api.nwlab.test'}) RETURN coalesce(s.is_scan_root, false) AS v"
        "true": true
      - id: coverage_on_the_org
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN d.recon_coverage_at IS NOT NULL AS v"
        "true": true
      - id: dns_checks_find_nothing_on_the_clean_org
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check'}) WHERE v.type IN ['spf_missing','dmarc_missing','dnssec_missing'] RETURN d.name + '|' + v.type AS v"
        count: 0
      - id: discovered_under_the_target
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test, v1.api.nwlab.test, v2.api.nwlab.test]
      - id: nothing_outside_the_target_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [nwlab.test, www.nwlab.test, shop.nwlab.test, mail.nwlab.test, secret.nwlab.test]
    common: true

  U7:
    title: NW-Exact, single domain with dotted prefixes
    create:
      targetDomain: nwlab.test
      subdomainList: [www., v1.api., a.b.c.d.]
      settings: *lab
    checks:
      - id: exactly_the_listed_hosts
        cypher: "MATCH (b:BaseURL) WHERE b.host ENDS WITH 'nwlab.test' RETURN DISTINCT b.host AS v"
        equals: [www.nwlab.test, v1.api.nwlab.test, a.b.c.d.nwlab.test]
    common: true

  U8:
    title: NW-NoRoot, a wildcard without its own name
    create:
      domainBatchHosts:
        - "*.api.nwlab.test"
        - v1.api.nwlab.test
      settings: *lab
    checks:
      - id: scan_root_never_probed
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [api.nwlab.test, nwlab.test]
      - id: no_scan_root_subdomain
        cypher: "MATCH (s:Subdomain {name:'api.nwlab.test'}) WHERE coalesce(s.is_scan_root, false) RETURN s.name AS v"
        count: 0
      - id: its_subdomains_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [v1.api.nwlab.test, v2.api.nwlab.test, admin.v1.api.nwlab.test, internal.v1.api.nwlab.test]
    common: true

  VH:
    title: >-
      vhost/SNI on web1 (plan 07): every nwlab.test name DNS points at
      192.88.99.60 serves its own page there, and none is a hidden vhost; the
      one name web1 serves with no DNS record still is
    create:
      # Every discovery source is off in this lab, so the hosts are listed: eight
      # names web1 serves with DNS, and vhost-only, which no zone has. In an
      # exact scope vhost/SNI tries listed names only, hence the full name in
      # its custom wordlist. Nine names, not more: web1's pages differ only by
      # the hostname they print, which the canonical fingerprint normalises
      # away, so from ten candidates up the noisy-frontend guard reads them as
      # one catch-all template and drops every anomaly before this rule runs.
      targetDomain: nwlab.test
      subdomainList: [www, shop, mail, secret, cdn, api, v1.api, v2.api, vhost-only]
      settings:
        <<: *lab
        scanModules: [domain_discovery, http_probe, vuln_scan]
        vhostSniEnabled: true
        vhostSniTestL7: true
        vhostSniTestL4: true
        vhostSniUseGraphCandidates: true
        vhostSniUseDefaultWordlist: false
        vhostSniCustomWordlist: vhost-only.nwlab.test
        vhostSniInjectDiscovered: true
        # web1's pages differ from its default page by a few bytes only
        vhostSniBaselineSizeTolerance: 0
    checks:
      - id: no_dns_known_name_is_a_finding
        cypher: "MATCH (v:Vulnerability {source:'vhost_sni_enum'}) WHERE v.hostname <> 'vhost-only.nwlab.test' RETURN v.hostname AS v"
        count: 0
      - id: the_name_with_no_dns_is_a_hidden_vhost
        cypher: "MATCH (v:Vulnerability {source:'vhost_sni_enum'}) RETURN v.name AS v"
        equals: ["Hidden Virtual Host: vhost-only.nwlab.test"]
      - id: dns_known_names_were_probed_and_set_aside
        cypher: "MATCH (i:IP {address:'192.88.99.60'}) RETURN coalesce(i.vhost_sni_suppressed_dns_known, 0) >= 5 AS v"
        "true": true
      - id: no_dns_known_subdomain_flagged_hidden
        cypher: "MATCH (s:Subdomain) WHERE s.vhost_hidden = true AND s.name <> 'vhost-only.nwlab.test' RETURN s.name AS v"
        count: 0
      - id: only_the_hidden_name_is_injected
        cypher: "MATCH (b:BaseURL) WHERE b.discovery_source = 'vhost_sni_enum' RETURN b.host AS v"
        equals: ["vhost-only.nwlab.test"]
    common: true

  WC:
    title: >-
      Wildcard DNS under a scan root (plan 08.3): *.wild.nwlab.test answers every
      name with web1, real.wild.nwlab.test has its own record on web2. The lab has
      no brute force, so the names arrive the way the lab discovers: the
      certificate web1 serves for wild.nwlab.test names four hosts that exist only
      through the wildcard, and real.wild. RedAmon's wildcard control (puredns is
      off here, as in every lab project) keeps real.wild and drops the other four.
    create:
      domainBatchHosts:
        - "*.wild.nwlab.test"
        - wild.nwlab.test
      settings: *lab
    checks:
      - id: the_zone_is_stamped_as_a_wildcard
        cypher: "MATCH (s:Subdomain {name:'wild.nwlab.test'}) RETURN s.is_wildcard_zone AS v"
        "true": true
      - id: the_wildcard_answers_with_web1
        cypher: "MATCH (s:Subdomain {name:'wild.nwlab.test'}) UNWIND coalesce(s.wildcard_ips, []) AS ip RETURN ip AS v"
        equals: [192.88.99.60]
      - id: wildcard_only_names_are_no_subdomain
        cypher: "MATCH (s:Subdomain) RETURN s.name AS v"
        disjoint: [admin.wild.nwlab.test, dev.wild.nwlab.test, vpn.wild.nwlab.test, staging.wild.nwlab.test]
      - id: wildcard_only_names_are_never_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [admin.wild.nwlab.test, dev.wild.nwlab.test, vpn.wild.nwlab.test, staging.wild.nwlab.test]
      # A certificate name merged after httpx becomes a scan target, not a
      # Subdomain node, unless tlsx or vhost/SNI writes it (neither runs here).
      # So the two checks above hold even without the control; these two, on
      # the run's own target list, are the ones that tell kept from dropped.
      - id: the_name_with_its_own_record_is_a_target
        recon_json: dns.subdomains
        superset: [wild.nwlab.test, real.wild.nwlab.test]
      - id: wildcard_only_names_are_no_target
        recon_json: dns.subdomains
        disjoint: [admin.wild.nwlab.test, dev.wild.nwlab.test, vpn.wild.nwlab.test, staging.wild.nwlab.test]
      - id: a_checked_zone_is_no_coverage_gap
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'wildcard_control' AS v"
        equals: [false]
    common: true

  WC-DNSOFF:
    title: >-
      The WC hosts with DNS resolution off (plan 08.1 and 08.3): nothing is
      resolved, so nothing reads as resolved, and the wildcard control does not
      run, so no zone is stamped. In this lab nothing is probed either (httpx
      gets no target without DNS), so no certificate name reaches the control
      unchecked and no wildcard_control coverage gap is due; that note is
      unit-tested (recon/tests/test_wildcard_control.py).
    create:
      domainBatchHosts:
        - "*.wild.nwlab.test"
        - wild.nwlab.test
      settings:
        <<: *lab
        dnsEnabled: false
    checks:
      - id: no_domain_is_a_checked_zone
        cypher: "MATCH (d:Domain) WHERE d.is_wildcard_zone IS NOT NULL RETURN d.name AS v"
        count: 0
      - id: no_subdomain_is_a_checked_zone
        cypher: "MATCH (s:Subdomain) WHERE s.is_wildcard_zone IS NOT NULL RETURN s.name AS v"
        count: 0
      - id: no_subdomain_reads_as_resolved
        cypher: "MATCH (s:Subdomain) WHERE s.status = 'resolved' RETURN s.name AS v"
        count: 0
      - id: no_subdomain_resolves_to_an_ip
        cypher: "MATCH (s:Subdomain)-[:RESOLVES_TO]->(i:IP) RETURN s.name AS v"
        count: 0
      - id: nothing_went_in_unchecked
        recon_json: dns.subdomains
        count: 0
      - id: so_no_wildcard_gap_is_due
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'wildcard_control' AS v"
        equals: [false]
    common: true

  FULL:
    title: >-
      The full pipeline on the lab zone with the Rules of Engagement on (E2E-B,
      R-1, R-2, R-33, R-48, S-20..S-22, S-28). One ENUMERATE group *.nwlab.test
      with its root and the E2E-B names as seeds; nearly every tool at its
      default. The RoE exclude 192.88.99.62/32 (web3: all of edge, half of
      mixed) and the name shop.nwlab.test, which arrives only through web1's
      certificate SANs. Under an IP/CIDR exclusion naabu is handed addresses
      only, so the lab's naabu works here (its own resolvers never see a lab
      name). masscan stays off: it bypasses the kernel route (README). The
      traffic half (nothing reached web3, no name with an excluded address sent
      anywhere, plain never probed on 443) is check_lab_traffic.py --expect
      excluded over the run's window.
    create:
      domainBatchHosts:
        - "*.nwlab.test"
        - nwlab.test
        - www.nwlab.test
        - api.nwlab.test
        - edge.nwlab.test
        - mixed.nwlab.test
        - plain.nwlab.test
        - two.nwlab.test
        - ghost.nwlab.test
      settings:
        <<: *lab
        naabuEnabled: true
        roeExcludedHosts: ["192.88.99.62/32", "shop.nwlab.test"]
        subdomainTakeoverEnabled: true
        baddnsEnabled: true
        tlsxIncludeHttpPorts: true
        graphqlSecurityEnabled: true
        webCachePoisonEnabled: true
        webCachePoisonTimeout: 600
        vhostSniEnabled: true
        vhostSniUseDefaultWordlist: false
        vhostSniCustomWordlist: vhost-only.nwlab.test
        vhostSniUseGraphCandidates: true
    checks:
      - id: domains_are_the_org
        cypher: "MATCH (d:Domain) RETURN d.name AS v"
        equals: [nwlab.test]
      # R-2 / R-1 must stay silent: no asset or finding names an excluded host
      - id: no_port_on_the_excluded_address
        cypher: "MATCH (i:IP {address:'192.88.99.62'})-[:HAS_PORT]->(p:Port) RETURN p.number AS v"
        count: 0
      - id: no_baseurl_for_an_excluded_name_or_address
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        disjoint: [shop.nwlab.test, edge.nwlab.test, mixed.nwlab.test, ghost.nwlab.test, 192.88.99.62]
      - id: no_endpoint_on_an_excluded_host
        cypher: "MATCH (b:BaseURL)-[:HAS_ENDPOINT]->(e:Endpoint) WHERE b.host IN ['shop.nwlab.test','edge.nwlab.test','mixed.nwlab.test','192.88.99.62'] RETURN b.host + e.path AS v"
        count: 0
      - id: no_finding_names_an_excluded_host
        cypher: "MATCH (v:Vulnerability) WITH v, [k IN keys(v) WHERE k IN ['url','host','hostname','target','target_ip','matched_ip','matched_at','base_url','source_url','final_url','ip','domain'] | toString(v[k])] AS f WHERE any(x IN f WHERE x CONTAINS 'shop.nwlab.test' OR x CONTAINS 'edge.nwlab.test' OR x CONTAINS 'mixed.nwlab.test' OR x CONTAINS '192.88.99.62') RETURN v.id AS v"
        count: 0
      # A redirect to a host the run may not touch is recorded, never followed
      # (B-SECCHK-ROE): to the excluded edge, to a name outside the run, to the
      # cloud metadata address.
      - id: direct_ip_redirects_recorded_not_followed
        cypher: "MATCH (v:Vulnerability {source:'security_check'}) WHERE v.type STARTS WITH 'direct_ip' AND v.url IN ['http://192.88.99.63','http://192.88.99.64','https://192.88.99.65'] RETURN v.url + ' ' + v.evidence AS v"
        equals:
          - "http://192.88.99.63 HTTP 302 redirect → http://edge.nwlab.test/ (1 redirect(s))"
          - "http://192.88.99.64 HTTP 302 redirect → http://www.nwlab-two.test/ (1 redirect(s))"
          - "https://192.88.99.65 HTTPS 302 redirect to http://169.254.169.254/latest/meta-data/"
      # B-TLSXSAN: a certificate name the RoE refuse becomes no Subdomain, yet
      # the certificate still lists it
      - id: no_subdomain_for_an_excluded_san
        cypher: "MATCH (s:Subdomain) WHERE s.name IN ['shop.nwlab.test', 'late-edge.nwlab.test'] RETURN s.name + ' (' + coalesce(s.source, '') + ')' AS v"
        count: 0
      - id: the_certificate_still_lists_the_excluded_san
        cypher: "MATCH (c:Certificate) UNWIND coalesce(c.san, []) AS n WITH n WHERE n = 'shop.nwlab.test' RETURN DISTINCT n AS v"
        equals: [shop.nwlab.test]
      # B-LATEROE / R-2 GROUP 1: a name learned on an excluded address (late,
      # from the `two` certificate's SANs) never joins the scan, and no
      # discovered name keeps the excluded address. The listed edge and mixed
      # resolve there by the operator's own list.
      - id: no_discovered_name_on_the_excluded_address
        cypher: "MATCH (s:Subdomain)-[:RESOLVES_TO]->(:IP {address:'192.88.99.62'}) WHERE NOT s.name IN ['nwlab.test','edge.nwlab.test','mixed.nwlab.test'] RETURN s.name AS v"
        count: 0
      - id: the_late_name_on_the_excluded_address_is_not_scanned
        cypher: "MATCH (b:BaseURL) WHERE b.host = 'late-edge.nwlab.test' RETURN b.url AS v"
        count: 0
      - id: the_certificate_still_lists_the_late_name
        cypher: "MATCH (c:Certificate) UNWIND coalesce(c.san, []) AS n WITH n WHERE n = 'late-edge.nwlab.test' RETURN DISTINCT n AS v"
        equals: [late-edge.nwlab.test]
      - id: no_answer_from_the_excluded_host_stored
        cypher: "MATCH (b:BaseURL)-[:HAS_ENDPOINT]->(e:Endpoint) WHERE coalesce(e.final_url, '') CONTAINS 'edge.nwlab.test' OR coalesce(e.title, '') CONTAINS 'web3' RETURN b.url + ' -> ' + coalesce(e.final_url, '') + ' ' + coalesce(e.title, '') AS v"
        count: 0
      - id: no_certificate_from_the_excluded_address
        cypher: "MATCH (c:Certificate) WHERE any(n IN coalesce(c.san, []) WHERE n IN ['edge.nwlab.test','mixed.nwlab.test']) OR coalesce(c.subject_cn,'') = 'edge.nwlab.test' RETURN c.cert_key AS v"
        count: 0
      - id: no_vhost_test_on_the_excluded_address
        cypher: "MATCH (i:IP {address:'192.88.99.62'}) WHERE i.vhost_sni_tested IS NOT NULL RETURN i.address AS v"
        count: 0
      - id: the_refusals_are_a_roe_excluded_gap
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'roe_excluded' AS v"
        "true": true
      # ... beside the hosts that must fire
      - id: allowed_hosts_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [nwlab.test, www.nwlab.test, api.nwlab.test, plain.nwlab.test, two.nwlab.test]
      # R-33: names only web1's certificate holds are probed (the SAN feedback)
      - id: certificate_san_names_probed
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [admin.v1.api.nwlab.test, internal.v1.api.nwlab.test]
      # S-20 / S-21: every port under the address that serves it
      - id: no_port_under_a_foreign_address
        cypher: "MATCH (i:IP)-[:HAS_PORT]->(p:Port) WHERE p.ip_address IS NOT NULL AND p.ip_address <> i.address RETURN i.address + ':' + toString(p.number) AS v"
        count: 0
      - id: port_8443_only_under_Y
        cypher: "MATCH (i:IP)-[:HAS_PORT]->(p:Port {number: 8443}) RETURN i.address AS v"
        equals: [192.88.99.65]
      - id: port_21_only_under_Y
        cypher: "MATCH (i:IP)-[:HAS_PORT]->(p:Port {number: 21}) RETURN i.address AS v"
        equals: [192.88.99.65]
      - id: port_80_of_two_only_under_X
        cypher: "MATCH (i:IP)-[:HAS_PORT]->(p:Port {number: 80}) WHERE i.address IN ['192.88.99.64','192.88.99.65'] RETURN i.address AS v"
        equals: [192.88.99.64]
      - id: port_443_under_both_X_and_Y
        cypher: "MATCH (i:IP)-[:HAS_PORT]->(p:Port {number: 443}) WHERE i.address IN ['192.88.99.64','192.88.99.65'] RETURN i.address AS v"
        equals: [192.88.99.64, 192.88.99.65]
      # S-28 / R-48: the HTTP-only host is checked on 80 and never called unreachable
      - id: plain_basic_auth_over_http_found
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'basic_auth_no_tls'}) RETURN v.url AS v"
        superset: ["http://plain.nwlab.test/"]
      # plain's :80 is live (naabu, httpx), so no module may list plain as a
      # skipped host: a bare entry reads as "the whole host not re-checked"
      # and keeps its findings forever. (A refusal of edge/mixed is not a cut
      # of the port evidence.)
      - id: plain_never_skipped_as_unreachable
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) UNWIND coalesce(d.recon_skipped_hosts, []) AS h WITH h WHERE h STARTS WITH 'plain.nwlab.test' OR h = '192.88.99.63' OR h = '192.88.99.63:80' RETURN h AS v"
        count: 0
      - id: self_signed_hosts_still_get_security_checks
        cypher: "MATCH (v:Vulnerability {source:'security_check'}) WHERE v.url STARTS WITH 'https://' AND v.url CONTAINS '.nwlab.test' RETURN v.url AS v"
        superset: ["https://www.nwlab.test"]
      - id: a_refused_certificate_is_a_graphql_gap_only
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'TLS certificate refused' AS v"
        "true": true
    common: true

  FULL-RUN2:
    title: >-
      FULL again after `lab_toggle.sh plain-fixed` (B-SECCHK-ROE run 2): plain
      no longer asks for Basic auth, and the RoE refusals of edge/mixed are no
      cut of plain's port evidence, so its finding is pruned.
    checks:
      - id: the_fixed_plain_finding_is_pruned
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'basic_auth_no_tls'}) RETURN v.url AS v"
        count: 0

  SECDNS:
    title: >-
      Org DNS checks on the dirty org (W2-SECDNS: R-24, R-36). Run 1 (default
      zones): SPF and DMARC missing, each once with `domain`, and the zone
      transfer the lab DNS allows for nwlab-two.test (an AXFR to ns1's address,
      in labdns's log). Run 2 after `lab_toggle.sh dmarc drop` (the _dmarc
      query unanswered): DMARC_KEPT_ON_NO_ANSWER. Run 3 after `lab_toggle.sh
      dmarc fixed`: DMARC_PRUNED. The SPF and AXFR rows hold on every run.
    create:
      targetDomain: nwlab-two.test
      subdomainList: [".", "www."]
      settings:
        <<: *lab
        scanModules: [domain_discovery, http_probe, vuln_scan]
        nucleiEnabled: false
    checks:
      - id: spf_missing_once_with_its_domain
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'spf_missing'}) RETURN coalesce(v.domain, '') AS v"
        equals: [nwlab-two.test]
      - id: zone_transfer_found_on_the_org_that_allows_it
        cypher: "MATCH (d:Domain)-[:HAS_VULNERABILITY]->(v:Vulnerability {source:'security_check', type:'zone_transfer'}) RETURN d.name AS v"
        equals: [nwlab-two.test]
    common: true

  SECDNS-RUN1:
    title: SECDNS after run 1 (default zones)
    checks:
      - id: dmarc_missing_once_with_its_domain
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'dmarc_missing'}) RETURN coalesce(v.domain, '') AS v"
        equals: [nwlab-two.test]
      - id: no_dmarc_gap_when_dns_answered
        cypher: "MATCH (d:Domain {name:'nwlab-two.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'dmarc_missing' AS v"
        equals: [false]

  SECDNS-DROP:
    title: SECDNS after run 2 (the _dmarc query goes unanswered)
    checks:
      - id: dmarc_missing_kept_on_no_answer
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'dmarc_missing'}) RETURN coalesce(v.domain, '') AS v"
        equals: [nwlab-two.test]
      - id: the_unanswered_check_is_a_security_check_gap
        cypher: "MATCH (d:Domain {name:'nwlab-two.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'dmarc_missing' AS v"
        "true": true

  SECDNS-FIXED:
    title: SECDNS after run 3 (nwlab-two.test publishes DMARC)
    checks:
      - id: dmarc_missing_pruned
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'dmarc_missing'}) RETURN v.id AS v"
        count: 0
      - id: no_dmarc_gap_once_answered
        cypher: "MATCH (d:Domain {name:'nwlab-two.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS 'dmarc_missing' AS v"
        equals: [false]

  R37:
    title: >-
      Security checks with every DNS check switched off (R-37), on the HTTP-only
      plain.nwlab.test (S-28). Run 1: Basic auth over HTTP fires. Run 2 after
      `lab_toggle.sh plain-fixed`: R37-FIXED, the finding is pruned (switched-off
      DNS checks no longer cut the whole security_check source). The RoE
      exclusion of web3 only makes naabu take addresses.
    create:
      targetDomain: nwlab.test
      subdomainList: [plain.]
      settings:
        <<: *lab
        naabuEnabled: true
        roeExcludedHosts: ["192.88.99.62/32"]
        scanModules: [domain_discovery, port_scan, http_probe, vuln_scan]
        nucleiEnabled: false
        securityCheckSpfMissing: false
        securityCheckDmarcMissing: false
        securityCheckDnssecMissing: false
        securityCheckZoneTransfer: false
    checks:
      - id: basic_auth_over_http_on_plain
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'basic_auth_no_tls'}) RETURN v.url AS v"
        equals: ["http://plain.nwlab.test/"]
      - id: plain_never_called_unreachable
        cypher: "MATCH (d:Domain) UNWIND coalesce(d.recon_skipped_hosts, []) AS h WITH h WHERE h STARTS WITH 'plain.nwlab.test' OR h STARTS WITH '192.88.99.63' RETURN h AS v"
        count: 0
    common: true

  R37-FIXED:
    title: R37 after run 2 (plain no longer asks for Basic auth)
    checks:
      - id: the_fixed_finding_is_pruned
        cypher: "MATCH (v:Vulnerability {source:'security_check', type:'basic_auth_no_tls'}) RETURN v.url AS v"
        count: 0
      - id: no_security_check_source_cut
        cypher: "MATCH (d:Domain {name:'nwlab.test'}) RETURN coalesce(d.recon_coverage_gaps, '') CONTAINS '\"source\": \"security_check\"' AS v"
        equals: [false]

  RCTRL:
    title: >-
      The must-fire control for the RoE cases (B-FD2, B-SECCHK-ROE): edge and
      mixed with NO exclusion are probed (check_lab_traffic.py --expect control),
      which also gives the graph an edge BaseURL. Then `roeExcludedHosts:
      ["192.88.99.62/32"]` and the partial runs from the graph (B-FD2-PARTIAL):
      web3 must stay silent and no new Endpoint or BaseURL appears for edge or
      mixed (RCTRL-PARTIAL).
    create:
      targetDomain: nwlab.test
      subdomainList: [www., edge., mixed.]
      settings:
        <<: *lab
        scanModules: [domain_discovery, http_probe, resource_enum, vuln_scan]
        nucleiTags: [tech]
        subdomainTakeoverEnabled: true
    checks:
      - id: edge_and_mixed_probed_without_the_exclusion
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [edge.nwlab.test, mixed.nwlab.test, www.nwlab.test]
    common: true

  S9:
    title: >-
      An EXACT group's crawl stays on its listed hosts (S-9): only api.nwlab.test
      is listed, its page links v1.api (an unlisted child) and shop (a sibling).
      After the full run, a partial Hakrawler must request neither (web1's log),
      and the recon log says "Listed hosts only (exact scope): subdomain crawling
      off". The control is S9-ENUM.
    create:
      targetDomain: nwlab.test
      subdomainList: [api.]
      settings:
        <<: *lab
        scanModules: [domain_discovery, http_probe, resource_enum]
        hakrawlerEnabled: true
        hakrawlerIncludeSubs: true
    checks:
      - id: only_the_listed_host_scanned
        cypher: "MATCH (b:BaseURL) WHERE b.host ENDS WITH 'nwlab.test' RETURN DISTINCT b.host AS v"
        equals: [api.nwlab.test]
    common: true

  S9-ENUM:
    title: The S-9 control, an ENUMERATE group on *.api with its root (the crawl may reach v1.api)
    create:
      domainBatchHosts: ["*.api.nwlab.test", api.nwlab.test]
      settings:
        <<: *lab
        scanModules: [domain_discovery, http_probe, resource_enum]
        hakrawlerEnabled: true
        hakrawlerIncludeSubs: true
    checks:
      - id: the_root_is_scanned
        cypher: "MATCH (b:BaseURL) RETURN DISTINCT b.host AS v"
        superset: [api.nwlab.test]
    common: true
