# web6 only: the image's nginx.conf plus a stream block, for the banner on 21
# that only Y serves (a banner grab must not try it on X, B-PORTS3).
user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;

events {
    worker_connections  256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    include /etc/nginx/conf.d/*.conf;
}

stream {
    log_format nwlab_stream '$time_iso8601 $remote_addr :$server_port stream';
    server {
        listen 21;
        access_log /dev/stdout nwlab_stream;
        return "220 nwlab two-Y FTP ready\r\n";
    }
}
