# web5 (192.88.99.64): X of two.nwlab.test (A -> web5 and web6). X serves 80
# and 443, Y serves 443, 8443 and 21, so 80 belongs under X only, 8443 and 21
# under Y only and 443 under both (B-PORTS2/3). `lab_toggle.sh x8443 on` makes
# X listen on 8443 too, through the runtime include below.
log_format nwlab '$time_iso8601 $remote_addr :$server_port host=$host sni=$ssl_server_name '
                 '"$request" $status ua="$http_user_agent"';

ssl_certificate     /etc/nginx/certs/two.crt;
ssl_certificate_key /etc/nginx/certs/two.key;

include /etc/nginx/extra/*.conf;

# The bare-IP root on 80 redirects to www.nwlab-two.test: a name outside the
# FULL project that resolves to a lab host (web2, which logs its Host). A
# direct-IP check must not follow it.
server {
    access_log /dev/stdout nwlab;
    listen 80 default_server;
    server_name _;

    location / {
        return 302 http://www.nwlab-two.test/;
    }
}

server {
    access_log /dev/stdout nwlab;
    listen 80;
    listen 443 ssl default_server;
    server_name two.nwlab.test;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>two.nwlab.test (X)</title></head><body><h1>two.nwlab.test X</h1></body></html>\n";
    }
    location / {
        return 404;
    }
}
