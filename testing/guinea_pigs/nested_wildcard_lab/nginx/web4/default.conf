# web4 (192.88.99.63): plain.nwlab.test, HTTP only. Nothing listens on 443, so
# a check that probes :443 for a host whose port scan and httpx found only 80
# open is a bug (B-SECCHK-ROE): its capture sidecar (pcap4) shows such a
# connect as a kernel SYN to 443 after the port scan.
log_format nwlab '$time_iso8601 $remote_addr :$server_port host=$host sni=$ssl_server_name '
                 '"$request" $status ua="$http_user_agent"';

# The bare-IP root (and any other name) redirects to edge.nwlab.test, which
# resolves only to the excluded web3: a direct-IP check must record the
# redirect without following it.
server {
    access_log /dev/stdout nwlab;
    listen 80 default_server;
    server_name _;

    location / {
        return 302 http://edge.nwlab.test/;
    }
}

server {
    access_log /dev/stdout nwlab;
    listen 80;
    server_name plain.nwlab.test;
    default_type text/html;

    # Basic auth over HTTP on the root: the one :80 finding plain carries
    # (basic_auth_no_tls). `lab_toggle.sh plain-fixed` drops it for the next
    # run, through the runtime include below, so the finding must be pruned.
    set $plain_auth "plain lab";
    include /etc/nginx/extra/*.conf;

    location = / {
        auth_basic $plain_auth;
        # empty: every login fails; the 401 and its WWW-Authenticate are the point
        auth_basic_user_file /etc/nginx/conf.d/plain.htpasswd;
        root /usr/share/nginx/html;
        index index.html;
    }
    location = /index.html {
        root /usr/share/nginx/html;
    }
    location / {
        return 404;
    }
}
