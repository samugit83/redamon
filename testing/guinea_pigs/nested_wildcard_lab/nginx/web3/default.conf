# web3 (192.88.99.62): the address the FULL scenario's Rules of Engagement
# exclude (192.88.99.62/32). It serves edge.nwlab.test (only here) and
# mixed.nwlab.test (here and on web2). With the exclusion in force nothing may
# reach it: not a port probe, a TLS handshake, nor a request. Its capture
# sidecar (pcap3) records every packet, so even a SYN that never became a
# request is seen.
log_format nwlab '$time_iso8601 $remote_addr :$server_port host=$host sni=$ssl_server_name '
                 '"$request" $status ua="$http_user_agent"';

ssl_certificate     /etc/nginx/certs/web3.crt;
ssl_certificate_key /etc/nginx/certs/web3.key;

server {
    access_log /dev/stdout nwlab;
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>web3 $host</title></head><body><h1>excluded host</h1></body></html>\n";
    }
    location / {
        return 404;
    }
}
