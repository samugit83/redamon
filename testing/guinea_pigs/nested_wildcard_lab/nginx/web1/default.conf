# web1 (192.88.99.60): every nwlab.test vhost, on 80 and 443. One certificate
# One line per request with the Host and the SNI it came with, so a check can
# tell which NAME reached this address (the image's default log has neither).
# check_lab_traffic.py reads these through `docker logs`.
log_format nwlab '$time_iso8601 $remote_addr :$server_port host=$host sni=$ssl_server_name '
                 '"$request" $status ua="$http_user_agent"';

# for every SNI, so tlsx and httpx see the same SAN list from any name.
ssl_certificate     /etc/nginx/certs/web1.crt;
ssl_certificate_key /etc/nginx/certs/web1.key;

# The body names the vhost from this fixed map, never from $host itself: a
# reflected Host header would add host-header findings that vary per scan.
map $host $nwlab_page {
    default              "unknown-vhost";
    nwlab.test           "nwlab.test";
    www.nwlab.test       "www.nwlab.test";
    shop.nwlab.test      "shop.nwlab.test";
    mail.nwlab.test      "mail.nwlab.test";
    secret.nwlab.test    "secret.nwlab.test";
    cdn.nwlab.test       "cdn.nwlab.test";
    v1.api.nwlab.test    "v1.api.nwlab.test";
    v2.api.nwlab.test    "v2.api.nwlab.test";
    admin.v1.api.nwlab.test    "admin.v1.api.nwlab.test";
    internal.v1.api.nwlab.test "internal.v1.api.nwlab.test";
    js-only.v2.api.nwlab.test  "js-only.v2.api.nwlab.test";
    eu.corp.nwlab.test         "eu.corp.nwlab.test";
    dev.eu.corp.nwlab.test     "dev.eu.corp.nwlab.test";
    staging.dev.eu.corp.nwlab.test "staging.dev.eu.corp.nwlab.test";
    a.b.c.d.nwlab.test   "a.b.c.d.nwlab.test";
    # Served here but in no zone: the one name vhost/SNI may call hidden (VH).
    vhost-only.nwlab.test "vhost-only.nwlab.test";
    wild.nwlab.test      "wild.nwlab.test";
}

server {
    access_log /dev/stdout nwlab;
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>$nwlab_page</title></head><body><h1>$nwlab_page</h1></body></html>\n";
    }
    location / {
        return 404;
    }
}

# The ENUMERATE scan root: its page loads app.js, which names one host under the
# scan root (must be injected for *.api) and one sibling (must not be). It also
# links an unlisted child (v1.api) and a sibling (shop): an EXACT group's crawl
# must request neither (S-9), and shop is the RoE-excluded name of FULL (R-1).
server {
    access_log /dev/stdout nwlab;
    listen 80;
    listen 443 ssl;
    server_name api.nwlab.test;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>api.nwlab.test</title><script src=\"/static/app.js\"></script></head><body><h1>api.nwlab.test</h1><a href=\"/openapi.json\">API description</a><a href=\"https://v1.api.nwlab.test/\">v1</a><a href=\"https://shop.nwlab.test/\">shop</a></body></html>\n";
    }
    location = /static/app.js {
        default_type application/javascript;
        alias /usr/share/nginx/static/app.js;
    }
    location = /openapi.json {
        default_type application/json;
        alias /usr/share/nginx/www/api-openapi.json;
    }
    location / {
        return 404;
    }
}

# A second OpenAPI document on another scan root of the same org, for the
# parallel partial OpenAPI runs that share Domain(nwlab.test).
server {
    access_log /dev/stdout nwlab;
    listen 80;
    listen 443 ssl;
    server_name www.nwlab.test;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>www.nwlab.test</title></head><body><h1>www.nwlab.test</h1><a href=\"/openapi.json\">API description</a></body></html>\n";
    }
    location = /openapi.json {
        default_type application/json;
        alias /usr/share/nginx/www/www-openapi.json;
    }
    location / {
        return 404;
    }
}

# Scenario WC: the scan root of a DNS-wildcard zone (*.wild answers with this
# host). Its certificate is the only way names under the wildcard reach a lab
# scan, since the lab has no brute force.
server {
    access_log /dev/stdout nwlab;
    listen 80;
    listen 443 ssl;
    server_name wild.nwlab.test *.wild.nwlab.test;
    ssl_certificate     /etc/nginx/certs/wild.crt;
    ssl_certificate_key /etc/nginx/certs/wild.key;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>$nwlab_page</title></head><body><h1>$nwlab_page</h1></body></html>\n";
    }
    location / {
        return 404;
    }
}
