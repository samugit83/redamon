# web6 (192.88.99.65): Y of two.nwlab.test (see web5): 443 and 8443 here, and
# an FTP-style banner on 21 (web6.nginx.conf, stream block).
log_format nwlab '$time_iso8601 $remote_addr :$server_port host=$host sni=$ssl_server_name '
                 '"$request" $status ua="$http_user_agent"';

ssl_certificate     /etc/nginx/certs/two.crt;
ssl_certificate_key /etc/nginx/certs/two.key;

# The bare-IP root on 443 redirects to the cloud metadata address, which no
# run resolves: a direct-IP check must record the redirect and never send it.
server {
    access_log /dev/stdout nwlab;
    listen 443 ssl default_server;
    server_name _;

    location / {
        return 302 http://169.254.169.254/latest/meta-data/;
    }
}

server {
    access_log /dev/stdout nwlab;
    listen 443 ssl;
    listen 8443 ssl default_server;
    server_name two.nwlab.test;
    default_type text/html;

    location = / {
        return 200 "<!doctype html><html><head><title>two.nwlab.test (Y)</title></head><body><h1>two.nwlab.test Y</h1></body></html>\n";
    }
    location / {
        return 404;
    }
}
