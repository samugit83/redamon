server {
    listen 80;
    default_type text/html;

    # Every path is a 200 with the same page echoing the path: the shape that
    # turns one reflected payload into endless "new" endpoints. The search link
    # carries an encoded payload IN THE PATH, which ZAP must not seed.
    location / {
        return 200 '<!doctype html><html><head><title>Catalog</title></head><body>
<h1>Catalog</h1><p>Path: $request_uri</p>
<a href="/docs/getting-started">Getting started</a>
<a href="/docs/api">API docs</a>
<a href="/search/%3Cimg%20src%3Dx%3E">Search</a>
</body></html>';
    }
}
