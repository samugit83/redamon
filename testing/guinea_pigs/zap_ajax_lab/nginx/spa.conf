server {
    listen 80;
    root /usr/share/nginx/html;
    default_type text/html;

    location = /app.js { default_type application/javascript; }

    # Every API path answers, so a request the browser makes is a 200 the
    # spider records, whatever the route.
    location /api/ {
        default_type application/json;
        return 200 '{"ok":true}';
    }

    # Client-side routes (/help) are served the app shell, like a real SPA.
    location / { try_files $uri /index.html; }
}
