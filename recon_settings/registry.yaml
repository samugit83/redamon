    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 10000 }
    meaning: >-
      Body size deltas within this many bytes are not flagged (suppresses
      Set-Cookie / timestamp jitter). Default 50.
  vhostSniConcurrency:
    tool: vhost_sni
    runtime_key: "VHOST_SNI_CONCURRENCY"
    unit: threads
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 100 }
    governor: { model: ratio, floor: 1 }
    meaning: >-
      How many Vhost / SNI enumeration operations run at once. The memory governor
      scales it down when the host is short of RAM, so the effective value can be
      below what is written here.
  vhostSniCustomWordlist:
    tool: vhost_sni
    runtime_key: "VHOST_SNI_CUSTOM_WORDLIST"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    validator: project_file
    group: wordlist
    meaning: >-
      Optional newline-separated custom prefixes/hostnames (per-project
      file/text). Bare prefixes expand as {prefix}.{target_apex}; full hostnames
