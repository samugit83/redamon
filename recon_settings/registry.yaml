    form_section: "RoeSection"
  roeEnabled:
    tool: roe
    runtime_key: "ROE_ENABLED"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: never
    group: engagement_limits
    meaning: >-
      DERIVED, never written. Engagement limits apply when there is a limit to
      apply: a non-zero roeGlobalMaxRps, OR a non-empty roeExcludedHosts, OR
      roeTimeWindowEnabled. The column is kept so old rows and old exports still
      load, and every service computes the value through
      recon_settings.engagement.derive_roe_enabled instead of reading it. A
      writable master switch would be a bypass shipped as a checkbox: one write
      of false and the ceiling, the exclusions and the window all stop applying
      at once while every other field still shows its configured value.
    deny_reason: derived
    form_section: null
    written_by: "nothing - it is derived"
  roeEngagementEndDate:
    tool: roe
    runtime_key: null
    unit: none
    phase: standalone
