fields:
  openapiEnabled:
    tool: openapi_recon
    runtime_key: "OPENAPI_ENABLED"
    unit: none
    phase: resource_enum
    traffic: active
    roe_capped: false
    mcp: settable
    stealth: { set: false }
    meaning: >-
      Whether to import declared API operations from OpenAPI documents. Fetches specifications but never calls declared operations.
  openapiAutoDiscover:
    tool: openapi_recon
    runtime_key: "OPENAPI_AUTO_DISCOVER"
    unit: none
    phase: resource_enum
    traffic: active
    roe_capped: false
    mcp: settable
    stealth: { set: false }
    meaning: >-
      Discover specifications from crawl results and configured paths on known in-scope base URLs. Opt-in and disabled in stealth mode.
  openapiDiscoveryPaths:
    tool: openapi_recon
    runtime_key: "OPENAPI_DISCOVERY_PATHS"
    unit: none
    phase: resource_enum
    traffic: active
    roe_capped: false
    mcp: settable
    stealth: { set: [] }
    validator: free_text
