      per-tool rate is capped to it at scan start, including the ones whose own
      value means 'unlimited'. ZERO MEANS NO CEILING, so this at 0 is not a slow
      engagement, it is an unlimited one. A non-zero value is also one of the three
      things that make the engagement limits live at all.
