  takeoverRateLimit:
    tool: takeover
    runtime_key: "TAKEOVER_RATE_LIMIT"
    unit: rps
    phase: vuln_scan
    traffic: active
    roe_capped: true
    mcp: settable
    bounds: { min: 1, max: 500 }
    stealth: { set: 10 }
    meaning: >-
      Requests per second takeover sends. Capped to the engagement ceiling at scan
      start, so a value above the ceiling is rewritten rather than refused.
  takeoverSeverity:
    tool: takeover
    runtime_key: "TAKEOVER_SEVERITY"
    unit: none
    phase: vuln_scan
    traffic: active
    roe_capped: false
    mcp: settable
    values: ["info", "low", "medium", "high", "critical", "unknown"]
    validator: severity
    meaning: >-
      Severity filter for Nuclei takeover templates (e.g.
      ["critical","high","medium"])
  targetDomain:
    tool: targeting
    runtime_key: "TARGET_DOMAIN"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: create_only
    validator: free_text
    coerce: strip
    group: scope
    meaning: >-
      The single root domain this engagement covers. THE scope column: every phase
      derives its hosts from it and the target guardrail measures against it. Set
      once at creation and immutable afterwards, because changing it on an
      existing project turns a rescan credential into one aimed at a third party.
      Leading and trailing whitespace is stripped at load.
  targetGuardrailEnabled:
    tool: targeting
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: create_only
    group: scope
    meaning: >-
      The hard guardrail that refuses to scan a host outside the declared scope.
      Turning it off removes the control that keeps the pipeline inside its
      engagement, which is why it moves with the scope and cannot change on an
      existing project.
  targetIps:
    tool: targeting
    runtime_key: "TARGET_IPS"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: create_only
    validator: free_text
    coerce: strip_list
    group: scope
    meaning: >-
      The IP addresses or CIDR ranges scanned when ipMode is on. Part of the
      engagement scope, so it is write-once. Empty entries are dropped and every
      entry is stripped at load.
  tlsxCipherConcurrency:
    tool: tlsx
    runtime_key: "TLSX_CIPHER_CONCURRENCY"
    unit: threads
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 500 }
    group: unbounded
    meaning: >-
      How many tlsx operations run at once. The memory governor scales it down
      when the host is short of RAM, so the effective value can be below what is
      written here.
  tlsxCipherEnum:
    tool: tlsx
    runtime_key: "TLSX_CIPHER_ENUM"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    stealth: { set: false }
    group: not-tuning
    meaning: >-
      Enumerate weak supported ciphers (extra connections per target). Default
      false.
  tlsxConcurrency:
    tool: tlsx
    runtime_key: "TLSX_CONCURRENCY"
    unit: threads
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 300 }
    stealth: { set: 5 }
    meaning: >-
      How many tlsx operations run at once. The memory governor scales it down
      when the host is short of RAM, so the effective value can be below what is
      written here.
  tlsxDelay:
    tool: tlsx
    runtime_key: "TLSX_DELAY"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      Optional -delay between connections (e.g. "200ms"); stealth only. Default
      "".
  tlsxDockerImage:
    tool: tlsx
    runtime_key: "TLSX_DOCKER_IMAGE"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    validator: docker_image
    group: image
    meaning: >-
      The container image spawned for tlsx. Any value outside the shipped
      allowlist is silently pinned back to the default at scan start, with a
      [guardrail] line recording it, so the field is open and the runtime is the
      control.
    values: ["caffix/amass:latest", "dolevf/graphql-cop:1.14", "frost19k/puredns:latest", "ghcr.io/zaproxy/zaproxy:stable", "jauderho/hakrawler:latest", "projectdiscovery/httpx:latest", "projectdiscovery/katana:latest", "projectdiscovery/naabu:latest", "projectdiscovery/nuclei:latest", "projectdiscovery/subfinder:latest", "projectdiscovery/tlsx:latest", "projectdiscovery/uncover:latest", "redamon-baddns:latest", "redamon-wcvs:latest", "sxcurity/gau:latest"]
  tlsxEnabled:
    tool: tlsx
    runtime_key: "TLSX_ENABLED"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether tlsx runs. Configuration is two levels: this flag decides whether
      the tool runs INSIDE its phase, and scanModules decides whether the phase
      runs at all. Setting one without the other is a silent no-op.
  tlsxIncludeHttpPorts:
    tool: tlsx
    runtime_key: "TLSX_INCLUDE_HTTP_PORTS"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Also grab certs on HTTP/HTTPS ports httpx already covers (duplicate
      handshakes). Default false.
  tlsxInjectHostnames:
    tool: tlsx
    runtime_key: "TLSX_INJECT_HOSTNAMES"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Merge in-scope certificate SAN hostnames into dns.subdomains as new probe
      targets. Default true.
  tlsxMaxHostnamesPerIp:
    tool: tlsx
    runtime_key: "TLSX_MAX_HOSTNAMES_PER_IP"
    unit: count
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 1000 }
    group: not-tuning
    meaning: >-
      When one IP serves several known hostnames, how many to scan (each may
      present a different cert). Default 1.
  tlsxMaxInjectedHostnames:
    tool: tlsx
    runtime_key: "TLSX_MAX_INJECTED_HOSTNAMES"
    unit: count
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 10000 }
    group: not-tuning
    meaning: >-
      Cap on in-scope certificate SAN hostnames merged back into dns.subdomains as
      scan targets. Default 200.
  tlsxMaxTargets:
    tool: tlsx
    runtime_key: "TLSX_MAX_TARGETS"
    unit: count
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 100000 }
    meaning: >-
      Hard cap on ip:port pairs tlsx scans. Default 2000.
  tlsxProbeJarm:
    tool: tlsx
    runtime_key: "TLSX_PROBE_JARM"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    stealth: { set: false }
    group: not-tuning
    meaning: >-
      Compute JARM + JA3 fingerprints (~10 extra handshakes per target, loud).
      Default false.
  tlsxRetries:
    tool: tlsx
    runtime_key: "TLSX_RETRIES"
    unit: count
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 10 }
    group: unbounded
    meaning: >-
      How many times tlsx retries a failed request before giving up on it.
  tlsxRevPtrSni:
    tool: tlsx
    runtime_key: "TLSX_REV_PTR_SNI"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Reverse-PTR to derive an SNI for bare IPs (extra DNS lookups). Default
      false.
  tlsxRunTimeout:
    tool: tlsx
    runtime_key: "TLSX_RUN_TIMEOUT"
    unit: seconds
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 86400 }
    group: unbounded
    meaning: >-
      How long tlsx may spend before it is abandoned, in seconds. A run that hits
      it contributes whatever it found so far rather than failing the scan.
  tlsxScanMode:
    tool: tlsx
    runtime_key: "TLSX_SCAN_MODE"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      TLS stack: ctls|ztls|openssl|auto. Default auto.
  tlsxTimeout:
    tool: tlsx
    runtime_key: "TLSX_TIMEOUT"
    unit: seconds
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 60 }
    meaning: >-
      How long tlsx may spend before it is abandoned, in seconds. A run that hits
      it contributes whatever it found so far rather than failing the scan.
  tlsxVersionEnum:
    tool: tlsx
    runtime_key: "TLSX_VERSION_ENUM"
    unit: none
    phase: http_probe
    traffic: active
    roe_capped: false
    mcp: settable
    stealth: { set: false }
    group: not-tuning
    meaning: >-
      Enumerate every supported TLS version (extra connections per target).
      Default false.
  triageReviewBudget:
    tool: agent
    runtime_key: null
    unit: count
    phase: standalone
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 10000 }
    group: not-tuning
    meaning: >-
      How many findings one triage job may review before it stops and reports what
      it got through.
    form_section: "CypherFixSettingsSection"
  trufflehogAllowVerificationOverlap:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Whether several detectors may verify the same candidate, which costs
      requests but catches more.
  trufflehogArchiveMaxDepth:
    tool: trufflehog
    runtime_key: null
    unit: depth
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 50 }
    zero_means: literal
    group: unbounded
    meaning: >-
      How many nested archives are extracted before the scan stops descending.
  trufflehogArchiveMaxSize:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      The largest archive extracted, in bytes. A larger one is skipped rather than
      exhausting the container.
  trufflehogArchiveTimeout:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      Seconds one archive extraction may take before it is abandoned.
  trufflehogConcurrency:
    tool: trufflehog
    runtime_key: null
    unit: threads
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 500 }
    group: unbounded
    meaning: >-
      How many sources trufflehog scans at once.
  trufflehogDetectorTimeout:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      Seconds one detector may spend verifying a candidate before it is abandoned.
  trufflehogDropUnverifiedJwt:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Discards JWTs that could not be verified, which are the bulk of the false
      positives in this class.
  trufflehogEnabled:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether trufflehog runs. Configuration is two levels: this flag decides
      whether the tool runs INSIDE its phase, and scanModules decides whether the
      phase runs at all. Setting one without the other is a silent no-op.
  trufflehogExcludeDetectors:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      Detectors that never run, whatever the include list says.
  trufflehogFilterEntropy:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      The Shannon entropy below which a candidate string is discarded before
      detection runs.
  trufflehogForceSkipArchives:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Skips archives entirely rather than extracting them, which is faster and
      misses anything inside.
  trufflehogForceSkipBinaries:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Skips binary files rather than scanning them for embedded strings.
  trufflehogIncludeDetectors:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      Restricts the run to these detectors. Empty means every detector runs.
  trufflehogMaxDecodeDepth:
    tool: trufflehog
    runtime_key: null
    unit: depth
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 50 }
    group: unbounded
    meaning: >-
      How many nested encodings are unwrapped before giving up on a candidate.
  trufflehogNoVerification:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Skip live verification entirely. When set, every finding lands `unverified`
      (never checked), which is NOT the same as "not live".
  trufflehogResultTypes:
    tool: trufflehog
    runtime_key: null
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      Which result statuses to report: a comma-separated subset of
      verified,unverified,unknown,filtered_unverified. Replaces the old
      trufflehogOnlyVerified boolean, which combined with trufflehogNoVerification
      asked TruffleHog to report only verified results while forbidding it to
      verify — zero findings, no error.
  uncoverDockerImage:
    tool: uncover
    runtime_key: "UNCOVER_DOCKER_IMAGE"
    unit: none
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    validator: docker_image
    group: image
    meaning: >-
      The container image spawned for uncover. Any value outside the shipped
      allowlist is silently pinned back to the default at scan start, with a
      [guardrail] line recording it, so the field is open and the runtime is the
      control.
    values: ["caffix/amass:latest", "dolevf/graphql-cop:1.14", "frost19k/puredns:latest", "ghcr.io/zaproxy/zaproxy:stable", "jauderho/hakrawler:latest", "projectdiscovery/httpx:latest", "projectdiscovery/katana:latest", "projectdiscovery/naabu:latest", "projectdiscovery/nuclei:latest", "projectdiscovery/subfinder:latest", "projectdiscovery/tlsx:latest", "projectdiscovery/uncover:latest", "redamon-baddns:latest", "redamon-wcvs:latest", "sxcurity/gau:latest"]
  uncoverEnabled:
    tool: uncover
    runtime_key: "UNCOVER_ENABLED"
    unit: none
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether uncover runs. Configuration is two levels: this flag decides whether
      the tool runs INSIDE its phase, and scanModules decides whether the phase
      runs at all. Setting one without the other is a silent no-op.
  uncoverMaxResults:
    tool: uncover
    runtime_key: "UNCOVER_MAX_RESULTS"
    unit: count
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 50000 }
    governor: { model: budget, family: osint_result, floor: 100 }
    fallback: falsy
    coerce: int
    meaning: >-
      The most results uncover accumulates in one pass. The memory governor
      budgets it against available RAM, so the effective value can be below what
      is written here.
  updateGraphDb:
    tool: pipeline
    runtime_key: "UPDATE_GRAPH_DB"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: never
    group: not-tuning
    meaning: >-
      Whether results are stored in the graph database. Off, the scan still runs
      and still reaches the target, and writes nothing, so every later read
      reports "nothing found" where the truth is "nothing was written". That is
      the scanned-and-clean versus never-scanned confusion, so it is a debug
      switch rather than a pipeline parameter.
    deny_reason: not-tuning
    form_section: null
  updatedAt:
    tool: project
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: never
    validator: free_text
    deny_reason: identity
    group: identity
    meaning: >-
      When the project row last changed. Written by the database on every update.
  updatedById:
    tool: project
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: never
    validator: free_text
    deny_reason: identity
    group: identity
    meaning: >-
      The user who last updated the project. Populated going forward only; may be
      null on older rows.
  urlscanEnabled:
    tool: urlscan
    runtime_key: "URLSCAN_ENABLED"
    unit: none
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether urlscan runs. Configuration is two levels: this flag decides whether
      the tool runs INSIDE its phase, and scanModules decides whether the phase
      runs at all. Setting one without the other is a silent no-op.
  urlscanMaxResults:
    tool: urlscan
    runtime_key: "URLSCAN_MAX_RESULTS"
    unit: count
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 50000 }
    stealth: { ceiling: 100 }
    governor: { model: budget, family: osint_result, floor: 100 }
    meaning: >-
      The most results urlscan accumulates in one pass. The memory governor
      budgets it against available RAM, so the effective value can be below what
      is written here.
  useBruteforceForSubdomains:
    tool: pipeline
    runtime_key: "USE_BRUTEFORCE_FOR_SUBDOMAINS"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: settable
    stealth: { set: false }
    group: intrusive
    meaning: >-
      Enable DNS brute-force for subdomain discovery
    form_section: "SubdomainDiscoverySection"
  userId:
    tool: project
    runtime_key: "USER_ID"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: never
    readable: false
    validator: free_text
    deny_reason: identity
    read_deny_reason: other_user
    group: identity
    meaning: >-
      The owning user. Writing it reassigns the project to someone else and
      configures nothing, which is why it is closed on every surface.
  verifyDomainOwnership:
    tool: targeting
    runtime_key: "VERIFY_DOMAIN_OWNERSHIP"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: create_only
    group: scope
    meaning: >-
      Requires a DNS TXT record proving control of the target before any active
      phase runs. Part of the scope's proof, so it is write-once.
