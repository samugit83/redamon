    meaning: >-
      The longest one denial-of-service attempt may run, in seconds. It is only
      reachable at all when roeAllowDos permits the technique.
  engagementIdentityHeader:
    tool: engagement
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: settable
    validator: http_header
    meaning: >-
      A header every request carries so the target's operators can attribute the
      traffic to this engagement, for example 'X-Bug-Bounty: your-handle'. Empty
      sends none. Many programs require one, and it is the difference between a
      scan that gets a question and one that gets a block. Validated like any
      other header: no CR or LF, and not Host, Authorization, Cookie or Proxy-*.
