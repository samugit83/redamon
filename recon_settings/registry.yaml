    written_by: "/api/supply-chain/[projectId]/upload"
    meaning: >-
      The uploaded SBOM this project analyses. Written only by the upload
      endpoint, which also places the file on disk; a second writer could name a
      file the project never uploaded.
  supplyChainTyposquatEnabled:
    tool: supply_chain
    runtime_key: "SUPPLY_CHAIN_TYPOSQUAT_ENABLED"
    unit: none
    phase: standalone
    traffic: passive
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether Supply chain scan runs. Configuration is two levels: this flag
      decides whether the tool runs INSIDE its phase, and scanModules decides
      whether the phase runs at all. Setting one without the other is a silent
      no-op.
    form_section: "SupplyChainReconSection"
  takeoverAiClassifier:
    tool: takeover
    runtime_key: "TAKEOVER_AI_CLASSIFIER"
    unit: none
    phase: vuln_scan
    traffic: active
    roe_capped: false
    mcp: settable
    group: llm
    meaning: >-
      Use AI to disambiguate takeover findings from WAF "no host" block pages that
      match the same static fingerprint (requires aiInPipeline=true). For each
      finding the scanner probes the host, short-circuits on third-party vendor
      tokens, and otherwise asks the LLM to classify the body. AI-flagged
      collisions get score -40 (lands in manual_review). Default false.
  takeoverCertValidationEnabled:
    tool: takeover
    runtime_key: "TAKEOVER_CERT_VALIDATION_ENABLED"
    unit: none
    phase: vuln_scan
    traffic: active
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether takeover runs. Configuration is two levels: this flag decides
      whether the tool runs INSIDE its phase, and scanModules decides whether the
      phase runs at all. Setting one without the other is a silent no-op.
  takeoverConfidenceThreshold:
    tool: takeover
    runtime_key: "TAKEOVER_CONFIDENCE_THRESHOLD"
    unit: percent
    phase: vuln_scan
    traffic: active
    roe_capped: false
    mcp: settable
    bounds: { min: 0, max: 100 }
    group: not-tuning
    meaning: >-
      0..100. Findings >= threshold+10 are confirmed, >= threshold are likely,
      otherwise manual_review
  takeoverManualReviewAutoPublish:
    tool: takeover
    runtime_key: "TAKEOVER_MANUAL_REVIEW_AUTO_PUBLISH"
    unit: none
    phase: vuln_scan
    traffic: active
    roe_capped: false
    mcp: settable
    group: not-tuning
    meaning: >-
      Publish manual_review findings into the main Vulnerability stream (default
