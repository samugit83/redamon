  roeExcludedHosts:
    tool: roe
    runtime_key: "ROE_EXCLUDED_HOSTS"
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: settable
    validator: free_text
    group: engagement_limits
    meaning: >-
      Hosts that must never be touched even though they fall inside the target
      scope. Enforced in three places in recon/main.py: expanded IPs, discovered
      subdomains and the target domain itself. A non-empty list is one of the three
      things that make the engagement limits live at all.
    form_section: "TargetSection"
  roeForbiddenCategories:
    tool: roe
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: settable
    values: ["brute_force", "dos", "social_engineering", "physical", "exploitation"]
    validator: free_text
    group: engagement_limits
    meaning: >-
      Technique categories the agent may not run on this engagement. Each token
      is expanded to the tools that perform it and refused before the tool
      executes (CATEGORY_TOOL_MAP in
      agentic/orchestrator_helpers/nodes/execute_plan_node.py), and the list is
      also withheld from the classifier's options. What each token covers:
      brute_force is any credential guessing, including brute forcing, password
      spraying and credential stuffing; dos is anything aimed at availability,
      including denial of service, resource exhaustion and volumetric or
      high-volume testing; social_engineering is anything aimed at a person
      rather than a system, including phishing, vishing, smishing and
      pretexting; physical is physical premises, hardware or tailgating;
      exploitation is taking a confirmed finding further than proving it. The
      vocabulary is closed because the gate matches these tokens EXACTLY: a
      free-text category such as "Denial of Service" reaches the agent's prompt
      as advice and never reaches the gate, so the refusal the UI promises
      silently does not happen.
    form_section: "AgentBehaviourSection"
  roeForbiddenTools:
    tool: roe
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: settable
    values: ["cve_intel", "execute_amass", "execute_arjun", "execute_code", "execute_curl", "execute_ffuf", "execute_gau", "execute_guarddog", "execute_httpx", "execute_hydra", "execute_jsluice", "execute_katana", "execute_naabu", "execute_nmap", "execute_nuclei", "execute_osv_scanner", "execute_playwright", "execute_subfinder", "execute_wpscan", "google_dork", "kali_shell", "metasploit_console", "msf_restart", "proxy_brain", "query_graph", "shodan", "tradecraft_lookup", "web_search"]
    validator: free_text
    group: engagement_limits
    meaning: >-
      Tools the agent may not run on this engagement, by name, whatever their own
      enable flag says. Refused before the tool executes, in
      agentic/orchestrator_helpers/nodes/execute_plan_node.py. The vocabulary is
      closed to the agent's real tool names because that gate is an exact string
      match: a near-miss like "hydra" for execute_hydra never matches, and the tool
      runs with the ban recorded and unenforced.
    form_section: "AgentBehaviourSection"
  roeGlobalMaxRps:
