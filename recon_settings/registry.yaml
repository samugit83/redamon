    tool: engagement
    runtime_key: null
    unit: none
    phase: standalone
    traffic: none
    roe_capped: false
    mcp: create_only
    values: ["internal", "third_party"]
    validator: identifier
    meaning: >-
      Who the target belongs to, and therefore what has to be true before a scan
      may start. 'internal' is your own estate. 'third_party' is somebody else's,
      and such a project MUST carry a non-zero rate ceiling and an authorization
      record or start_recon refuses it. Set at creation and immutable afterwards:
      converting a project after the fact would either claim an authority nobody
      granted or drop a ceiling a human put there. Every project created before
      this field existed reads as 'internal', so an old project with no ceiling is
      flagged rather than blocked.
