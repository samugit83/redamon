    mcp: settable
    validator: free_text
    group: not-tuning
    meaning: >-
      "base_urls" or "base_urls_and_endpoints" seed selection
  zoomEyeEnabled:
    tool: zoomeye
    runtime_key: "ZOOMEYE_ENABLED"
    unit: none
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    meaning: >-
      Whether ZoomEye runs. Configuration is two levels: this flag decides whether
      the tool runs INSIDE its phase, and scanModules decides whether the phase
      runs at all. Setting one without the other is a silent no-op.
  zoomEyeMaxResults:
    tool: zoomeye
    runtime_key: "ZOOMEYE_MAX_RESULTS"
    unit: count
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 10000 }
    governor: { model: budget, family: osint_result, floor: 100 }
    meaning: >-
      The most results ZoomEye accumulates in one pass. The memory governor
      budgets it against available RAM, so the effective value can be below what
      is written here.
  zoomEyeWorkers:
    tool: zoomeye
    runtime_key: "ZOOMEYE_WORKERS"
    unit: threads
    phase: domain_discovery
    traffic: passive
    roe_capped: false
    mcp: settable
    bounds: { min: 1, max: 20 }
    stealth: { set: 1 }
    governor: { model: ratio, floor: 1 }
    meaning: >-
      How many ZoomEye operations run at once. The memory governor scales it down
      when the host is short of RAM, so the effective value can be below what is
      written here.

# Runtime keys with no Prisma column. Not MCP-reachable, but the derived
# cap list is a query over this file, so a rate that lives only here is in it.
runtime_only:
  AUTH_PROFILE:
    source: project_relation
    tool: auth_profile
    unit: none
    roe_capped: false
    secret: true
    meaning: >-
      The authenticated session the scan replays: cookies, headers and the login
      steps that produced them. Deliberately a RELATION rather than a Project
      column, because GET /api/projects/[id] spreads every Project scalar to the
      browser and a credential stored as a column would leak. It arrives in the
      same API payload the settings load reads, so the pipeline sees it as a
      runtime key with no column behind it.
  CENSYS_API_TOKEN:
    source: user_account
    tool: censys
    unit: none
    roe_capped: false
    secret: true
    meaning: >-
      The user's own API credential for this data source, fetched per scan from
      the user account. Never a project column, so it is not reachable from any
      project-scoped surface.
